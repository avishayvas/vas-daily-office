<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרכז המשימות היומי — VAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12161d;
  --panel:#1a202b;
  --panel2:#212938;
  --line:#2b3444;
  --line-soft:#232b39;
  --text:#e8ecf3;
  --text-dim:#93a0b4;
  --text-faint:#5f6c80;
  --accent:#e08a3c;
  --accent-soft:#3a2c1c;
  --blue:#5a8dee;
  --blue-soft:#1c2740;
  --purple:#a37fe0;
  --purple-soft:#2a2140;
  --teal:#3fb6b0;
  --teal-soft:#163632;
  --green:#48b57a;
  --green-soft:#173328;
  --red:#e0605a;
  --red-soft:#3a1f1e;
  --amber:#e0b84a;
  --amber-soft:#3a2f16;
  --radius:10px;
  --font: 'Rubik', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
:root[data-theme="light"]{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f4; --line:#dbe0e8; --line-soft:#e7eaef;
  --text:#1c2330; --text-dim:#5a6577; --text-faint:#8b95a5;
  --accent-soft:#fbe7d2; --blue-soft:#e1eaff; --purple-soft:#ece3fb; --green-soft:#dff4e8; --red-soft:#fbe1e0; --amber-soft:#faf0d4; --teal-soft:#dcf3f1;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f4; --line:#dbe0e8; --line-soft:#e7eaef;
    --text:#1c2330; --text-dim:#5a6577; --text-faint:#8b95a5;
    --accent-soft:#fbe7d2; --blue-soft:#e1eaff; --purple-soft:#ece3fb; --green-soft:#dff4e8; --red-soft:#fbe1e0; --amber-soft:#faf0d4; --teal-soft:#dcf3f1;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  display:flex; min-height:100vh; font-size:14.5px; line-height:1.5;
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- layout ---------- */
.app{display:flex; width:100%; min-height:100vh;}
.sidebar{
  width:230px; flex:0 0 230px; background:var(--panel); border-left:1px solid var(--line);
  padding:18px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px 8px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#c9631f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1206;flex:none;font-size:15px;}
.brand-text .t1{font-weight:700;font-size:14.5px;}
.brand-text .t2{font-size:11.5px;color:var(--text-faint);}
.navgroup{margin-top:10px;}
.navlabel{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;padding:10px 10px 4px;}
.navitem{
  display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; border-radius:8px;
  cursor:pointer; color:var(--text-dim); font-weight:500; transition:background .12s;
}
.navitem:hover{background:var(--panel2);}
.navitem.active{background:var(--accent-soft); color:var(--accent);}
.navitem .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.navitem .label{display:flex;align-items:center;gap:9px;}
.navbadge{
  font-family:var(--mono); font-size:11px; background:var(--panel2); color:var(--text-dim);
  border-radius:20px; padding:1px 7px; min-width:20px; text-align:center;
}
.navitem.active .navbadge{background:rgba(224,138,60,.22); color:var(--accent);}
.navbadge.warn{background:var(--red-soft); color:var(--red);}
.sidebar-foot{margin-top:auto; padding-top:12px; border-top:1px solid var(--line-soft);}
.who-select{width:100%;}

.main{flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; overflow-y:auto;}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  padding:16px 26px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
}
.topbar h1{font-size:19px; margin:0; font-weight:700;}
.topbar .sub{font-size:12.5px; color:var(--text-faint); margin-top:2px;}
.topbar-actions{display:flex; gap:8px; align-items:center;}
.content{padding:22px 26px 60px;}

/* ---------- controls ---------- */
button{font-family:var(--font); cursor:pointer;}
.btn{
  border:1px solid var(--line); background:var(--panel); color:var(--text); padding:8px 14px;
  border-radius:8px; font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; gap:6px; transition:.12s;
}
.btn:hover{border-color:var(--text-faint);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#1a1206; font-weight:700;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-dim);}
.btn-ghost:hover{background:var(--panel2); color:var(--text);}
.btn-danger{color:var(--red); border-color:var(--red-soft); background:var(--red-soft);}
.btn-sm{padding:5px 10px; font-size:12.5px; border-radius:7px;}
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{
  background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px;
  padding:8px 10px; font-family:var(--font); font-size:13.5px; width:100%;
}
textarea{resize:vertical; min-height:64px;}
label.field{display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--text-dim); margin-bottom:12px;}
label.field b{color:var(--text); font-weight:600; font-size:12.5px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px; border:1px solid var(--line);
  background:var(--panel); color:var(--text-dim); font-size:12.5px; cursor:pointer; font-weight:500;
}
.chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
.filterbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}

/* ---------- badges ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;}
.b-task{background:var(--blue-soft); color:var(--blue);}
.b-reminder{background:var(--amber-soft); color:var(--amber);}
.b-invoice{background:var(--purple-soft); color:var(--purple);}
.b-quote{background:var(--green-soft); color:var(--green);}
.b-supplier_bill{background:var(--teal-soft); color:var(--teal);}
.b-todo{background:var(--panel2); color:var(--text-dim);}
.b-doing{background:var(--amber-soft); color:var(--amber);}
.b-done{background:var(--green-soft); color:var(--green);}
.b-cancelled{background:var(--red-soft); color:var(--red);}
.b-urgent{background:var(--red-soft); color:var(--red);}

/* ---------- board ---------- */
.board{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; align-items:start;}
@media(max-width:980px){.board{grid-template-columns:1fr;}}
.col{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px; min-height:80px;}
.col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 4px;}
.col-head h3{font-size:13.5px; margin:0; font-weight:700;}
.col-count{font-family:var(--mono); font-size:11.5px; color:var(--text-faint);}
.card{
  background:var(--panel2); border:1px solid var(--line-soft); border-radius:9px; padding:11px 12px; margin-bottom:9px;
  cursor:pointer; transition:.12s; border-right:3px solid var(--line);
}
.card:hover{border-color:var(--text-faint); transform:translateY(-1px);}
.card.type-task{border-right-color:var(--blue);}
.card.type-reminder{border-right-color:var(--amber);}
.card.type-invoice{border-right-color:var(--purple);}
.card.type-supplier_bill{border-right-color:var(--teal);}
.card.type-quote{border-right-color:var(--green);}
.card.overdue{box-shadow:inset 0 0 0 1px var(--red-soft);}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px;}
.card-title{font-weight:600; font-size:13.5px; line-height:1.35;}
.card-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; font-size:11.5px; color:var(--text-faint);}
.card-meta span{display:inline-flex; align-items:center; gap:4px;}
.card-actions{display:flex; gap:6px; margin-top:9px;}
.overdue-flag{color:var(--red); font-size:11px; font-weight:700; display:flex; align-items:center; gap:4px;}
.empty-col{padding:18px 6px; text-align:center; color:var(--text-faint); font-size:12.5px;}

/* ---------- payment alert banner ---------- */
.pay-banner{
  display:flex; align-items:center; gap:12px; background:var(--red-soft); border:1px solid var(--red);
  border-radius:9px; padding:12px 16px; margin-bottom:20px; color:var(--text);
}
.pay-banner b{color:var(--red);}
.pay-banner .btn{margin-inline-start:auto;}
.attach-box{
  display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px dashed var(--line);
  border-radius:8px; padding:9px 11px; font-size:12.5px; margin-bottom:12px;
}
.attach-box a{color:var(--blue); text-decoration:none; font-weight:600;}
.countdown{font-family:var(--mono); font-weight:700; font-size:12px;}
.cd-ok{color:var(--text-faint);}
.cd-soon{color:var(--amber);}
.cd-urgent{color:var(--red);}

/* ---------- reminder strip ---------- */
.reminder-strip{display:flex; flex-direction:column; gap:8px; margin-bottom:22px;}
.reminder-row{
  display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
  border-radius:9px; padding:10px 14px;
}
.reminder-row.done{opacity:.5;}
.reminder-time{font-family:var(--mono); font-weight:700; color:var(--amber); font-size:13px; min-width:52px;}
.reminder-title{flex:1; font-weight:500; font-size:13.5px;}
.check{
  width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line); background:var(--panel2);
  display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer; font-size:13px;
}
.check.checked{background:var(--green); border-color:var(--green); color:#08210f;}

/* ---------- lists (invoices/quotes/archive) ---------- */
.tablewrap{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:right; font-size:11.5px; color:var(--text-faint); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--panel2); white-space:nowrap;}
td{padding:10px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover td{background:var(--panel2);}
.amount{font-family:var(--mono); font-weight:600;}
.muted{color:var(--text-faint);}
.section-title{font-size:15px; font-weight:700; margin:26px 0 12px; display:flex; align-items:center; gap:8px;}
.section-title:first-child{margin-top:0;}

/* ---------- stat cards ---------- */
.stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
.stat-card .n{font-size:26px; font-weight:800; font-family:var(--mono);}
.stat-card .l{font-size:12px; color:var(--text-faint); margin-top:4px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
.bar-label{width:90px; font-size:12.5px; color:var(--text-dim); flex:none;}
.bar-track{flex:1; height:16px; background:var(--panel2); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent); border-radius:4px;}
.bar-val{width:26px; text-align:left; font-family:var(--mono); font-size:12px; color:var(--text-faint);}

/* ---------- empty state ---------- */
.empty{text-align:center; padding:50px 20px; color:var(--text-faint);}
.empty .big{font-size:34px; margin-bottom:10px;}

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(8,10,14,.62); display:none; align-items:flex-start; justify-content:center;
  z-index:100; padding:5vh 16px; overflow-y:auto;
}
.overlay.show{display:flex;}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:14px; width:100%; max-width:560px; padding:22px 24px; box-shadow:0 20px 60px rgba(0,0,0,.4);}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-head h2{font-size:16.5px; margin:0;}
.modal-close{background:none; border:none; color:var(--text-faint); font-size:20px; line-height:1; padding:2px 6px;}
.type-tabs{display:flex; gap:6px; margin-bottom:16px;}
.type-tab{flex:1; text-align:center; padding:9px 6px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:12.5px; font-weight:600; color:var(--text-dim);}
.type-tab.active.t-task{border-color:var(--blue); color:var(--blue); background:var(--blue-soft);}
.type-tab.active.t-reminder{border-color:var(--amber); color:var(--amber); background:var(--amber-soft);}
.type-tab.active.t-invoice{border-color:var(--purple); color:var(--purple); background:var(--purple-soft);}
.type-tab.active.t-supplier_bill{border-color:var(--teal); color:var(--teal); background:var(--teal-soft);}
.type-tab.active.t-quote{border-color:var(--green); color:var(--green); background:var(--green-soft);}
.modal-foot{display:flex; justify-content:space-between; gap:10px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line-soft);}
.status-btns{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.status-btn{padding:7px 12px; border-radius:7px; border:1px solid var(--line); background:var(--panel2); color:var(--text-dim); font-size:12.5px; font-weight:600;}
.status-btn.active{background:var(--accent); border-color:var(--accent); color:#1a1206;}
.log-list{max-height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-top:6px;}
.log-item{font-size:12px; color:var(--text-dim); background:var(--panel2); border-radius:7px; padding:8px 10px;}
.log-item b{color:var(--text);}
.log-ts{color:var(--text-faint); font-family:var(--mono); font-size:10.5px;}
.detail-meta{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.hint{font-size:11.5px; color:var(--text-faint); margin-top:-6px; margin-bottom:12px;}
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line);
  color:var(--text); padding:10px 18px; border-radius:9px; font-size:13px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.3);
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
.csv-box{width:100%; height:180px; font-family:var(--mono); font-size:11.5px; direction:ltr; text-align:left;}

/* ---------- login screen ---------- */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg);}
.login-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px 28px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.35);}
.login-brand{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
.login-brand .brand-mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#c9631f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1206;font-size:18px;flex:none;}
.login-brand .t1{font-weight:700; font-size:16.5px;}
.login-brand .t2{font-size:12px; color:var(--text-faint);}
.login-status{text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13.5px;}
.pin-dots{display:flex; gap:10px; justify-content:center; margin:6px 0 4px;}
.pin-dots input{
  width:44px; height:52px; text-align:center; font-size:22px; font-family:var(--mono);
  background:var(--panel2); border:1px solid var(--line); border-radius:9px; color:var(--text);
}
.login-error{color:var(--red); font-size:12.5px; text-align:center; margin-top:10px; min-height:16px;}
.login-btn{width:100%; margin-top:16px;}
.role-badge{display:inline-flex; align-items:center; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px;}
.role-badge.manager{background:var(--accent-soft); color:var(--accent);}
.role-badge.office{background:var(--blue-soft); color:var(--blue);}
.role-badge.field{background:var(--green-soft); color:var(--green);}
.whoami{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9px; background:var(--panel2); margin-bottom:8px;}
.whoami .name{font-weight:600; font-size:13px; flex:1;}
.session-note{font-size:11px; color:var(--text-faint); text-align:center; margin-top:14px; line-height:1.5;}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-card" id="loginCard">
    <div class="login-brand">
      <div class="brand-mark">V</div>
      <div>
        <div class="t1">מרכז המשימות</div>
        <div class="t2">VAS · ניהול משרד יומי</div>
      </div>
    </div>
    <div id="loginBody" class="login-status">מתחבר…</div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">V</div>
      <div class="brand-text">
        <div class="t1">מרכז המשימות</div>
        <div class="t2">VAS · ניהול משרד יומי</div>
      </div>
    </div>

    <div class="navgroup">
      <div class="navitem active" data-view="today" onclick="setView('today')">
        <span class="label"><span class="dot" style="background:var(--accent)"></span>היום</span>
        <span class="navbadge" id="nb-today">0</span>
      </div>
      <div class="navitem" data-view="board" onclick="setView('board')">
        <span class="label"><span class="dot" style="background:var(--blue)"></span>לוח משימות</span>
        <span class="navbadge" id="nb-board">0</span>
      </div>
      <div class="navitem" data-view="invoices" data-roles="manager,office" onclick="setView('invoices')">
        <span class="label"><span class="dot" style="background:var(--purple)"></span>חשבונות לשליחה</span>
        <span class="navbadge" id="nb-invoices">0</span>
      </div>
      <div class="navitem" data-view="quotes" data-roles="manager,office" onclick="setView('quotes')">
        <span class="label"><span class="dot" style="background:var(--green)"></span>הצעות מחיר</span>
        <span class="navbadge" id="nb-quotes">0</span>
      </div>
      <div class="navitem" data-view="suppliers" data-roles="manager,office" onclick="setView('suppliers')">
        <span class="label"><span class="dot" style="background:var(--teal)"></span>חשבונות ספקים</span>
        <span class="navbadge" id="nb-suppliers">0</span>
      </div>
      <div class="navitem" data-view="archive" onclick="setView('archive')">
        <span class="label"><span class="dot" style="background:var(--text-faint)"></span>ארכיון</span>
        <span class="navbadge" id="nb-archive">0</span>
      </div>
      <div class="navitem" data-view="stats" data-roles="manager,office" onclick="setView('stats')">
        <span class="label"><span class="dot" style="background:#fff2"></span>סטטיסטיקה</span>
      </div>
      <div class="navitem" data-view="reports" data-roles="manager,office" onclick="setView('reports')">
        <span class="label"><span class="dot" style="background:var(--green)"></span>דוח הכנסות והוצאות</span>
      </div>
      <div class="navitem" data-view="team" data-roles="manager" onclick="setView('team')">
        <span class="label"><span class="dot" style="background:#fff2"></span>ניהול משתמשים והרשאות</span>
      </div>
    </div>

    <div class="sidebar-foot">
      <div class="whoami">
        <span class="name" id="whoamiName">—</span>
        <span class="role-badge" id="whoamiRole"></span>
      </div>
      <button class="btn btn-sm" style="width:100%" onclick="logout()">התנתקות</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">היום</h1>

<script type="module">
/* ============================= FIREBASE BRIDGE ============================= */
/* Loads the Firebase modular SDK from a CDN and exposes a small bridge object
   (window.__hub) plus two callback hooks (window.__hubAuthReady / window.__hubAuthError)
   that the classic script below defines and calls once auth resolves. This keeps the
   rest of the app as one big classic <script> with inline onclick handlers, while still
   getting real-time Firestore sync. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
  onSnapshot, query, writeBatch, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const BUILTIN_FB = {
  apiKey: "AIzaSyC7J0s6YXQBtlezzK88-9bhRjG-c_Sl4gU",
  authDomain: "vas--system.firebaseapp.com",
  projectId: "vas--system",
  storageBucket: "vas--system.firebasestorage.app",
  messagingSenderId: "558157805234",
  appId: "1:558157805234:web:e9f4e6809fe82329533bab"
};

try{
  const fbApp = initializeApp(BUILTIN_FB);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);

  window.__hub = {
    db, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
    onSnapshot, query, writeBatch, serverTimestamp
  };

  onAuthStateChanged(auth, (user)=>{
    if(user && typeof window.__hubAuthReady === 'function'){
      window.__hubAuthReady(user);
    }
  });
  signInAnonymously(auth).catch(err=>{
    console.error('Firebase anonymous sign-in failed', err);
    if(typeof window.__hubAuthError === 'function') window.__hubAuthError(err);
  });
}catch(err){
  console.error('Firebase init failed', err);
  if(typeof window.__hubAuthError === 'function') window.__hubAuthError(err);
}

<script>
/* ============================= DATA LAYER ============================= */
/* Source of truth is now Firestore (collections prefixed hub_). `state` below is the
   in-memory cache the render functions read; it is populated live from onSnapshot
   listeners set up in the AUTH / LOGIN / SYNC section further down. */
const FS = {
  team: 'hub_team',
  items: 'hub_items',
  suppliers: 'hub_suppliers',
  filechunks: 'hub_filechunks'
};
const CHUNK_SIZE = 700*1024; // ~700KB per chunk, safely under Firestore's ~1MiB doc limit

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function daysUntil(dateStr){ if(!dateStr) return null; return daysBetween(todayStr(), dateStr); }
const TERMS_PRESETS = ['מזומן','שוטף','שוטף+15','שוטף+30','שוטף+45','שוטף+60','שוטף+90','אחר'];
const PAY_METHOD_LABEL = { credit:'אשראי', transfer:'העברה בנקאית', '':'לא נבחר' };
function parseTermsDays(terms){
  if(!terms) return null;
  if(terms==='מזומן') return 0;
  const m = terms.match(/שוטף\s*\+?\s*(\d+)/);
  return m ? parseInt(m[1],10) : null;
}
function getSupplierInfo(name){
  if(!name) return null;
  return state.supplierDirectory[name.trim()] || null;
}
function upsertSupplierDirectory(name, terms, method){
  if(!name) return;
  const key = name.trim();
  if(!key) return;
  state.supplierDirectory[key] = { terms: terms||'', method: method||'' };
}
function supplierDatalistHtml(){
  return `<datalist id="supplierDatalist">${Object.keys(state.supplierDirectory).map(n=>`<option value="${escapeAttr(n)}">`).join('')}</datalist>`;
}
function termsSelectHtml(id, current){
  const isPreset = TERMS_PRESETS.includes(current);
  const customVal = (!isPreset && current) ? current : '';
  return `<select id="${id}" onchange="document.getElementById('${id}_custom').style.display = this.value==='אחר' ? 'block':'none'">
      ${TERMS_PRESETS.map(t=>`<option value="${t}" ${(current===t || (!isPreset && t==='אחר'))?'selected':''}>${t}</option>`).join('')}
    </select>
    <input type="text" id="${id}_custom" placeholder="פירוט תנאי תשלום" value="${escapeAttr(customVal)}" style="margin-top:6px; display:${(!isPreset && current)?'block':'none'}">`;
}
function methodSelectHtml(id, current){
  return `<select id="${id}">
      <option value="" ${!current?'selected':''}>לא נבחר</option>
      <option value="credit" ${current==='credit'?'selected':''}>אשראי</option>
      <option value="transfer" ${current==='transfer'?'selected':''}>העברה בנקאית</option>
    </select>`;
}
function readTermsValue(selectId){
  const sel = document.getElementById(selectId);
  if(!sel) return '';
  if(sel.value==='אחר'){
    const custom = document.getElementById(selectId+'_custom');
    return custom ? custom.value.trim() : '';
  }
  return sel.value;
}
function setTermsFieldValue(selectId, termsStr){
  const sel = document.getElementById(selectId);
  const custom = document.getElementById(selectId+'_custom');
  if(!sel || !termsStr) return;
  if(TERMS_PRESETS.includes(termsStr)){
    sel.value = termsStr;
    if(custom) custom.style.display='none';
  } else {
    sel.value = 'אחר';
    if(custom){ custom.value = termsStr; custom.style.display='block'; }
  }
}
function onSupplierPick(prefix){
  const clientEl = document.getElementById(prefix+'_client');
  if(!clientEl) return;
  const info = getSupplierInfo(clientEl.value);
  if(!info) return;
  const termsSel = document.getElementById(prefix+'_terms');
  const termsCustom = document.getElementById(prefix+'_terms_custom');
  const methodSel = document.getElementById(prefix+'_method');
  if(termsSel){
    if(TERMS_PRESETS.includes(info.terms)){
      termsSel.value = info.terms;
      if(termsCustom) termsCustom.style.display='none';
    } else if(info.terms){
      termsSel.value = 'אחר';
      if(termsCustom){ termsCustom.value = info.terms; termsCustom.style.display='block'; }
    }
  }  if(methodSel) methodSel.value = info.method || '';
  if(prefix==='f'){
    const days = parseTermsDays(info.terms);
    if(days!==null){
      const dueEl = document.getElementById('f_due');
      if(dueEl){
        const d = new Date(); d.setDate(d.getDate()+days);
        dueEl.value = d.toISOString().slice(0,10);
      }
    }
  }
}
function overdueItems(){
  const today = todayStr();
  return state.items.filter(i=> (i.status==='todo'||i.status==='doing') && i.rolloverCount>0 && i.activeDate<=today)
    .sort((a,b)=> (b.rolloverCount||0) - (a.rolloverCount||0));
}
function upcomingPayments(){
  const today = todayStr();
  return state.items.filter(i=>{
    if(i.type!=='supplier_bill') return false;
    if(i.status==='done'||i.status==='cancelled') return false;
    const d = daysUntil(i.dueDate);
    return d!==null && d<=PAYMENT_ALERT_DAYS;
  }).sort((a,b)=> (a.dueDate||'').localeCompare(b.dueDate||''));
}
function countdownHtml(dueDate){
  const d = daysUntil(dueDate);
  if(d===null) return '<span class="countdown cd-ok">—</span>';
  if(d<0) return `<span class="countdown cd-urgent">באיחור ${-d} ימים</span>`;
  if(d===0) return `<span class="countdown cd-urgent">היום!</span>`;
  if(d<=PAYMENT_ALERT_DAYS) return `<span class="countdown cd-soon">בעוד ${d} ימים</span>`;
  return `<span class="countdown cd-ok">בעוד ${d} ימים</span>`;
}
function uid(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowTs(){ const d=new Date(); return d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }
function heDate(dstr){
  if(!dstr) return '—';
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('he-IL',{weekday:'short', day:'numeric', month:'short'});
}

let state = {
  items: [],              // live cache of hub_items docs
  users: [],              // live cache of hub_team docs (full: name/pin/role/active)
  team: [],               // derived: names of ACTIVE hub_team docs (what the UI reads)
  supplierDirectory: {},  // derived: { supplierName: {terms, method} } from hub_suppliers
  currentUser: '',        // logged-in person's display name (audit-log actor)
  currentUserId: '',      // logged-in person's hub_team doc id
  currentUserRole: '',    // 'manager' | 'office' | 'field'
};

/* ---- rollover engine: anything not done/cancelled and dated before today jumps to today.
   The once-per-day gate is intentionally LOCAL (per device), not shared via Firestore —
   a small risk of double-incrementing rolloverCount across simultaneous devices right at
   midnight is an accepted tradeoff, not worth over-engineering. ---- */
const ROLLOVER_GATE_KEY = 'vas_hub_rollover_date';
function runRollover(){
  const today = todayStr();
  let lastGate;
  try{ lastGate = localStorage.getItem(ROLLOVER_GATE_KEY); }catch(e){ lastGate = null; }
  if(lastGate === today) return;
  let moved = 0;
  const changed = [];
  state.items.forEach(it=>{
    if((it.status==='todo'||it.status==='doing') && it.activeDate < today){
      const gap = daysBetween(it.activeDate, today);
      it.rolloverCount = (it.rolloverCount||0) + gap;
      addLog(it, `הועבר אוטומטית מתאריך ${heDate(it.activeDate)} ל-${heDate(today)} — לא הושלם`, true);
      it.activeDate = today;
      moved++;
      changed.push(it);
    }
  });
  try{ localStorage.setItem(ROLLOVER_GATE_KEY, today); }catch(e){}
  if(changed.length && window.__hub){
    try{
      const { db, doc, writeBatch } = window.__hub;
      const batch = writeBatch(db);
      changed.forEach(it=> batch.update(doc(db, FS.items, it.id), { activeDate: it.activeDate, rolloverCount: it.rolloverCount, log: it.log }));
      batch.commit().catch(e=>console.error('rollover batch commit failed', e));
    }catch(e){ console.error('rollover batch failed', e); }
  }
  if(moved>0) setTimeout(()=>showToast(`${moved} פריטים לא-גמורים הועברו אוטומטית להיום`), 400);
}

function addLog(item, text, silent){
  item.log = item.log || [];
  item.log.unshift({ ts: nowTs(), actor: silent ? 'מערכת' : state.currentUser, text });
}

/* ============================= LABELS ============================= */
const TYPE_LABEL = { task:'משימה', reminder:'תזכורת', invoice:'חשבון לשליחה', quote:'הצעת מחיר', supplier_bill:'חשבון ספק לתשלום' };
const TYPE_BADGE_CLASS = { task:'b-task', reminder:'b-reminder', invoice:'b-invoice', quote:'b-quote', supplier_bill:'b-supplier_bill' };
const PAYMENT_ALERT_DAYS = 7;

function statusLabel(type, status){
  const map = {
    task:     { todo:'לביצוע', doing:'בטיפול', done:'הושלם', cancelled:'בוטל' },
    reminder: { todo:'לביצוע', doing:'בטיפול', done:'בוצע',  cancelled:'בוטל' },
    invoice:  { todo:'להכנה',  doing:'נשלח — ממתין לתשלום', done:'שולם', cancelled:'בוטל' },
    quote:    { todo:'להכנה',  doing:'נשלחה — ממתין לתשובה', done:'אושרה', cancelled:'נדחתה' },
    supplier_bill: { todo:'ממתין לתשלום', doing:'בתהליך תשלום', done:'שולם', cancelled:'בוטל' },
  };
  return (map[type]||map.task)[status] || status;
}
function statusBadgeClass(status){
  return { todo:'b-todo', doing:'b-doing', done:'b-done', cancelled:'b-cancelled' }[status] || 'b-todo';
}

/* ============================= AUTH / LOGIN / REAL-TIME SYNC ============================= */
const ROLE_LABEL = { manager:'מנהל/ת', office:'משרד', field:'שטח' };
const FINANCIAL_TYPES = ['invoice','quote','supplier_bill'];
const SESSION_KEY = 'vas_hub_session';
let hubAuthUser = null;
let teamLoadedOnce = false;
let loginResolved = false;
let pendingLoginUserId = null;
let unsubTeam=null, unsubItems=null, unsubSuppliers=null;

window.__hubAuthReady = function(user){
  hubAuthUser = user;
  startFirestoreSync();
};
window.__hubAuthError = function(err){
  showLoginError('שגיאת התחברות לשרת — בדוק/י את החיבור לאינטרנט ורענן/י את הדף.');
};
// Fallback: if auth/sync never resolves (blocked network, ad-blocker, etc.) stop staring at "מתחבר…"
setTimeout(()=>{ if(!teamLoadedOnce) showLoginError('לא הצלחנו להתחבר לשרת. בדוק/י חיבור לאינטרנט ורענן/י את הדף.'); }, 15000);

function showLoginError(msg){
  const body = document.getElementById('loginBody');
  if(body) body.innerHTML = `<div class="login-error" style="margin-top:0">${escapeHtml(msg)}</div>`;
}

function startFirestoreSync(){
  if(!window.__hub || unsubTeam) return; // already started
  const { db, collection, onSnapshot } = window.__hub;

  unsubTeam = onSnapshot(collection(db, FS.team), snap=>{
    const docs = [];
    snap.forEach(d=> docs.push({ id:d.id, ...d.data() }));
    state.users = docs;
    state.team = docs.filter(u=>u.active).map(u=>u.name);
    teamLoadedOnce = true;

    if(docs.length===0){ bootstrapDefaultManager(); }

    // Live-reflect role/active changes on the logged-in user without requiring re-login.
    if(state.currentUserId){
      const me = docs.find(u=>u.id===state.currentUserId);
      if(!me || !me.active){
        logout(false, 'ההרשאה שלך הוסרה או שהמשתמש בוטל — יש להתחבר מחדש.');
      } else if(me.role !== state.currentUserRole || me.name !== state.currentUser){
        state.currentUserRole = me.role;
        state.currentUser = me.name;
        try{ localStorage.setItem(SESSION_KEY, JSON.stringify({docId:me.id, name:me.name, role:me.role})); }catch(e){}
        applyRoleVisibility();
        guardCurrentView();
        document.getElementById('whoamiName').textContent = me.name;
        document.getElementById('whoamiRole').textContent = ROLE_LABEL[me.role]||me.role;
        document.getElementById('whoamiRole').className = 'role-badge '+me.role;
        render();
      }
    } else if(!loginResolved){
      loginResolved = true;
      tryRestoreSession();
    } else if(document.getElementById('loginScreen').style.display!=='none'){
      renderLoginPicker(); // still on the picker screen — refresh the list live
    }
  }, err=>{ console.error('hub_team snapshot error', err); showLoginError('שגיאה בטעינת רשימת הצוות.'); });

  unsubItems = onSnapshot(collection(db, FS.items), snap=>{
    const docs = [];
    snap.forEach(d=> docs.push({ id:d.id, ...d.data() }));
    state.items = docs;
    if(document.getElementById('app').style.display!=='none'){
      runRollover();
      render();
    }
  }, err=>console.error('hub_items snapshot error', err));

  unsubSuppliers = onSnapshot(collection(db, FS.suppliers), snap=>{
    const dir = {};
    snap.forEach(d=>{ const data=d.data(); dir[data.name||d.id] = { terms:data.terms||'', method:data.method||'' }; });
    state.supplierDirectory = dir;
  }, err=>console.error('hub_suppliers snapshot error', err));
}

function bootstrapDefaultManager(){
  if(!window.__hub) return;
  const { db, doc, setDoc } = window.__hub;
  // fixed doc id -> idempotent even if two clients race to bootstrap an empty collection
  setDoc(doc(db, FS.team, 'avishai_default'), {
    name:'אבישי', pin:'1234', role:'manager', active:true, createdAt: Date.now()
  }, { merge:true }).catch(e=>console.error('bootstrap failed', e));
}

function tryRestoreSession(){
  let session = null;
  try{ session = JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){}
  if(session && session.docId){
    const u = state.users.find(x=>x.id===session.docId);
    if(u && u.active){ applySession(u); return; }
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  }
  renderLoginPicker();
}

function applySession(u){
  state.currentUser = u.name;
  state.currentUserId = u.id;
  state.currentUserRole = u.role;
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({docId:u.id, name:u.name, role:u.role})); }catch(e){}
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='';
  document.getElementById('whoamiName').textContent = u.name;
  document.getElementById('whoamiRole').textContent = ROLE_LABEL[u.role]||u.role;
  document.getElementById('whoamiRole').className = 'role-badge '+u.role;
  applyRoleVisibility();
  guardCurrentView();
  runRollover();
  render();
  setTimeout(maybeShowDailyAlert, 500);
}

function logout(silent, message){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  state.currentUser=''; state.currentUserId=''; state.currentUserRole='';
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='';
  renderLoginPicker();
  if(!silent) showToast('התנתקת');
  if(message) showLoginError(message);
}

function renderLoginPicker(){
  const body = document.getElementById('loginBody');
  if(!body) return;
  if(pendingLoginUserId){
    const u = state.users.find(x=>x.id===pendingLoginUserId);
    if(!u){ pendingLoginUserId=null; renderLoginPicker(); return; }
    body.innerHTML = `
      <div class="whoami"><span class="name">${escapeHtml(u.name)}</span>
        <button type="button" class="btn btn-sm btn-ghost" onclick="pendingLoginUserId=null; renderLoginPicker();">החלפה</button>
      </div>
      <div class="pin-dots">
        <input type="tel" inputmode="numeric" maxlength="1" id="pin0">
        <input type="tel" inputmode="numeric" maxlength="1" id="pin1">
        <input type="tel" inputmode="numeric" maxlength="1" id="pin2">
        <input type="tel" inputmode="numeric" maxlength="1" id="pin3">
      </div>
      <div class="login-error" id="loginErr"></div>
      <button type="button" class="btn btn-primary login-btn" onclick="submitLoginPin('${u.id}')">כניסה</button>
    `;
    setupPinAutoAdvance();
    const first = document.getElementById('pin0');
    if(first) first.focus();
    return;
  }
  const active = state.users.filter(u=>u.active).sort((a,b)=>a.name.localeCompare(b.name,'he'));
  let hint = '';
  if(state.users.length===1 && state.users[0].id==='avishai_default'){
    hint = `<div class="session-note">התקנה ראשונה: יש להתחבר בתור <b>אבישי</b> עם קוד <b>1234</b>, ומומלץ להחליף את הקוד מיד במסך "ניהול משתמשים והרשאות".</div>`;
  }
  body.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:6px">
      ${active.length ? active.map(u=>`<button type="button" class="btn" style="width:100%;justify-content:flex-start" onclick="pendingLoginUserId='${u.id}'; renderLoginPicker();">
          <span style="flex:1;text-align:right">${escapeHtml(u.name)}</span>
          <span class="role-badge ${u.role}">${ROLE_LABEL[u.role]||u.role}</span>
        </button>`).join('') : '<div class="muted" style="text-align:center">אין עדיין משתמשים פעילים</div>'}
    </div>
    ${hint}
  `;
}

function setupPinAutoAdvance(){
  const ids = ['pin0','pin1','pin2','pin3'];
  ids.forEach((id,i)=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', ()=>{
      el.value = el.value.replace(/[^0-9]/g,'').slice(0,1);
      if(el.value && ids[i+1]) document.getElementById(ids[i+1]).focus();
    });
    el.addEventListener('keydown', (e)=>{
      if(e.key==='Backspace' && !el.value && ids[i-1]) document.getElementById(ids[i-1]).focus();
      if(e.key==='Enter') submitLoginPin(pendingLoginUserId);
    });
  });
}

function submitLoginPin(id){
  const u = state.users.find(x=>x.id===id);
  if(!u) return;
  const pin = ['pin0','pin1','pin2','pin3'].map(i=>{ const el=document.getElementById(i); return el?el.value:''; }).join('');
  if(pin.length<4 || pin!==u.pin){
    const err = document.getElementById('loginErr');
    if(err) err.textContent = 'קוד שגוי — נסה/י שוב';
    ['pin0','pin1','pin2','pin3'].forEach(i=>{ const el=document.getElementById(i); if(el) el.value=''; });
    const first = document.getElementById('pin0');
    if(first) first.focus();
    return;
  }
  pendingLoginUserId = null;
  applySession(u);
}

/* ---------- role gating ---------- */
const ROLE_GATED_VIEWS = ['invoices','quotes','suppliers','stats','reports','team'];
function applyRoleVisibility(){
  document.querySelectorAll('[data-roles]').forEach(el=>{
    const roles = el.getAttribute('data-roles').split(',').map(s=>s.trim());
    el.style.display = roles.includes(state.currentUserRole) ? '' : 'none';
  });
}
function roleCanView(view){
  if(!ROLE_GATED_VIEWS.includes(view)) return true;
  const el = document.querySelector(`.navitem[data-view="${view}"]`);
  if(!el) return true;
  const roles = (el.getAttribute('data-roles')||'').split(',').map(s=>s.trim());
  return roles.includes(state.currentUserRole);
}
function guardCurrentView(){
  if(!roleCanView(currentView)) currentView = 'today';
}
function visibleItemsForRole(items){
  if(state.currentUserRole==='field') return items.filter(i=>!FINANCIAL_TYPES.includes(i.type));
  return items;
}

/* ============================= VIEW STATE ============================= */
let currentView = 'today';
let boardFilter = { assignee:'all', type:'all' };
let archiveFilter = { type:'all', assignee:'all', from:'', to:'' };

function setView(v){
  if(!roleCanView(v)) v = 'today';
  currentView = v;
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active', n.dataset.view===v));
  render();
}

/* ============================= RENDER DISPATCH ============================= */
function render(){
  guardCurrentView();
  applyRoleVisibility();
  updateNavBadges();
  const titles = {
    today:['היום', new Date().toLocaleDateString('he-IL',{weekday:'long', day:'numeric', month:'long', year:'numeric'})],
    board:['לוח משימות', 'כל המשימות הפתוחות לפי סטטוס'],
    invoices:['חשבונות לשליחה', 'מעקב אחרי חשבונות ללקוחות עד לתשלום'],
    quotes:['הצעות מחיר', 'מעקב אחרי הצעות מחיר עד לתשובה'],
    suppliers:['חשבונות ספקים לתשלום', 'מעקב אחרי חשבוניות ספק עד לתשלום, עם התראה שבוע מראש'],
    archive:['ארכיון', 'כל מה שהושלם או בוטל'],
    stats:['סטטיסטיקה', 'תמונת מצב כללית'],
    team:['צוות והגדרות', 'ניהול אנשי הצוות'],
    reports:['דוח הכנסות והוצאות', 'תמונת מצב פיננסית — מה התקבל, מה שולם, ומה עדיין פתוח'],
  };
  document.getElementById('pageTitle').textContent = titles[currentView][0];
  document.getElementById('pageSub').textContent = titles[currentView][1];
  const c = document.getElementById('content');
  if(currentView==='today') c.innerHTML = renderTodayView();
  else if(currentView==='board') c.innerHTML = renderBoardView();
  else if(currentView==='invoices') c.innerHTML = renderTableView('invoice');
  else if(currentView==='quotes') c.innerHTML = renderTableView('quote');
  else if(currentView==='suppliers') c.innerHTML = renderSuppliersView();
  else if(currentView==='archive') c.innerHTML = renderArchiveView();
  else if(currentView==='stats') c.innerHTML = renderStatsView();
  else if(currentView==='team') c.innerHTML = renderTeamView();
  else if(currentView==='reports') c.innerHTML = renderReportsView();
}

function updateNavBadges(){
  const today = todayStr();
  const open = visibleItemsForRole(state.items).filter(i=>i.status==='todo'||i.status==='doing');
  document.getElementById('nb-today').textContent = open.filter(i=>i.activeDate<=today).length;
  document.getElementById('nb-board').textContent = open.length;
  document.getElementById('nb-invoices').textContent = open.filter(i=>i.type==='invoice').length;
  document.getElementById('nb-quotes').textContent = open.filter(i=>i.type==='quote').length;
  document.getElementById('nb-archive').textContent = state.items.filter(i=>i.status==='done'||i.status==='cancelled').length;
  const openSuppliers = open.filter(i=>i.type==='supplier_bill');
  const nbSuppliers = document.getElementById('nb-suppliers');
  nbSuppliers.textContent = openSuppliers.length;
  nbSuppliers.classList.toggle('warn', upcomingPayments().length>0);
  const overdueBadge = document.getElementById('nb-today');
  overdueBadge.classList.toggle('warn', open.some(i=>i.rolloverCount>0));
}

/* ============================= TODAY VIEW ============================= */
function renderTodayView(){
  const today = todayStr();
  const items = visibleItemsForRole(state.items);
  const reminders = items.filter(i=>i.type==='reminder' && i.activeDate<=today).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const openItems = items.filter(i=>i.type!=='reminder' && (i.status==='todo'||i.status==='doing') && i.activeDate<=today);
  const doneToday = items.filter(i=>i.status==='done' && i.doneDate===today);
  const upcoming = state.currentUserRole==='field' ? [] : upcomingPayments();
  const overdue = overdueItems().filter(i=>state.currentUserRole!=='field' || !FINANCIAL_TYPES.includes(i.type));

  let html = '';

  if(overdue.length){
    html += `<div class="pay-banner">
      <span>⏳</span>
      <div>
        <b>${overdue.length} פריטים</b> לא הושלמו ועברו מיום קודם —
        ${overdue.slice(0,3).map(o=>`${escapeHtml(o.title)} (נדחה ${o.rolloverCount})`).join(', ')}${overdue.length>3?' ועוד...':''}
      </div>
      <button class="btn btn-sm" onclick="setView('board')">לצפייה</button>
    </div>`;
  }

  if(upcoming.length){
    html += `<div class="pay-banner">
      <span>⚠️</span>
      <div>
        <b>${upcoming.length} חשבונות ספק לתשלום</b> בשבוע הקרוב —
        ${upcoming.slice(0,3).map(u=>`${escapeHtml(u.client||u.title)} (${countdownHtml(u.dueDate)})`).join(', ')}${upcoming.length>3?' ועוד...':''}
      </div>
      <button class="btn btn-sm" onclick="setView('suppliers')">לצפייה</button>
    </div>`;
  }

  if(reminders.length){
    html += `<div class="section-title">⏰ תזכורות</div><div class="reminder-strip">`;
    reminders.forEach(r=>{
      const checked = r.status==='done';
      html += `<div class="reminder-row ${checked?'done':''}">
        <div class="check ${checked?'checked':''}" onclick="quickToggleReminder('${r.id}')">${checked?'✓':''}</div>
        <div class="reminder-time">${r.time||'—'}</div>
        <div class="reminder-title" onclick="openDetail('${r.id}')">${escapeHtml(r.title)}</div>
        ${r.rolloverCount>0?`<span class="overdue-flag">⏳ נדחה ${r.rolloverCount}×</span>`:''}
        <span class="badge b-${r.assignee?'todo':'todo'}" style="background:var(--panel2);color:var(--text-dim)">${escapeHtml(r.assignee||'—')}</span>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="section-title">📋 פתוח להיום (${openItems.length})</div>`;
  if(!openItems.length){
    html += emptyState('הכל סגור להיום', 'אין משימות פתוחות — אפשר להוסיף חדשה מהכפתורים למעלה.');
  } else {
    const doing = openItems.filter(i=>i.status==='doing');
    const todo = openItems.filter(i=>i.status==='todo');
    html += `<div class="board">
      ${boardColumn('בטיפול', doing, 'var(--amber)')}
      ${boardColumn('לביצוע', todo, 'var(--text-faint)')}
      ${boardColumn('הושלם היום', doneToday, 'var(--green)')}
    </div>`;
  }
  return html;
}

function quickToggleReminder(id){
  const it = state.items.find(i=>i.id===id);
  if(!it) return;
  if(it.status==='done'){
    it.status='todo'; addLog(it,'תזכורת סומנה כלא-בוצעה מחדש');
  } else {
    it.status='done'; it.doneDate=todayStr(); it.completedBy=state.currentUser;
    addLog(it, `סומן כבוצע ע״י ${state.currentUser}`);
  }
  render();
  if(window.__hub){
    const { db, doc, updateDoc } = window.__hub;
    updateDoc(doc(db, FS.items, id), { status: it.status, doneDate: it.doneDate, completedBy: it.completedBy, log: it.log })
      .catch(e=>{ console.error('reminder toggle failed', e); showToast('העדכון לשרת נכשל'); });
  }
}

/* ============================= BOARD VIEW ============================= */
function renderBoardView(){
  let items = visibleItemsForRole(state.items).filter(i=>i.status==='todo'||i.status==='doing');
  if(boardFilter.assignee!=='all') items = items.filter(i=>i.assignee===boardFilter.assignee);
  if(boardFilter.type!=='all') items = items.filter(i=>i.type===boardFilter.type);
  const todo = items.filter(i=>i.status==='todo');
  const doing = items.filter(i=>i.status==='doing');
  const overdue = items.filter(i=>i.rolloverCount>0);

  let html = `<div class="filterbar">
    ${chipGroup('type', ['all','task','reminder','invoice','quote','supplier_bill'], boardFilter.type, 'boardFilter')}
    ${assigneeFilterSelect(boardFilter.assignee, 'onBoardAssignee')}
  </div>`;
  html += `<div class="board">
    ${boardColumn('לביצוע', todo, 'var(--text-faint)')}
    ${boardColumn('בטיפול', doing, 'var(--amber)')}
    ${boardColumn('נדחה יותר מפעם אחת ⏳', overdue, 'var(--red)')}
  </div>`;
  return html;
}

function onBoardAssignee(v){ boardFilter.assignee=v; render(); }

function boardColumn(title, items, color){
  let html = `<div class="col"><div class="col-head"><h3 style="color:${color}">${title}</h3><span class="col-count">${items.length}</span></div>`;
  if(!items.length){ html += `<div class="empty-col">אין פריטים</div>`; }
  items.forEach(it=> html += cardHtml(it));
  html += `</div>`;
  return html;
}

function cardHtml(it){
  const overdue = it.rolloverCount>0 && it.status!=='done' && it.status!=='cancelled';
  let metaBits = [`<span>${escapeHtml(it.assignee||'לא משויך')}</span>`];
  if(it.type==='invoice'||it.type==='quote'||it.type==='supplier_bill'){
    if(it.client) metaBits.push(`<span>${escapeHtml(it.client)}</span>`);
    if(it.amount) metaBits.push(`<span>₪${Number(it.amount).toLocaleString()}</span>`);
  }
  if(it.type==='supplier_bill'){
    metaBits.push(countdownHtml(it.dueDate));
    if(it.terms) metaBits.push(`<span>${escapeHtml(it.terms)}</span>`);
    if(it.paymentMethod) metaBits.push(`<span>${PAY_METHOD_LABEL[it.paymentMethod]}</span>`);
  }
  if(it.fileData) metaBits.push('<span>📎</span>');
  if(it.priority==='urgent') metaBits.push(`<span class="badge b-urgent">דחוף</span>`);
  return `<div class="card type-${it.type} ${overdue?'overdue':''}" onclick="openDetail('${it.id}')">
    <div class="card-top">
      <div class="card-title">${escapeHtml(it.title)}</div>
      <span class="badge ${TYPE_BADGE_CLASS[it.type]}">${TYPE_LABEL[it.type]}</span>
    </div>
    ${it.desc?`<div class="muted" style="font-size:12px">${escapeHtml(truncate(it.desc,70))}</div>`:''}
    <div class="card-meta">${metaBits.join('')}</div>
    ${overdue?`<div class="overdue-flag" style="margin-top:7px">⏳ נדחה ${it.rolloverCount} ימים — מקור: ${heDate(it.createdDate)}</div>`:''}
  </div>`;
}

/* ============================= INVOICES / QUOTES TABLE ============================= */
function renderTableView(type){
  const items = state.items.filter(i=>i.type===type && i.status!=='done' && i.status!=='cancelled')
    .sort((a,b)=> (b.rolloverCount||0) - (a.rolloverCount||0));
  const closedCount = state.items.filter(i=>i.type===type && (i.status==='done'||i.status==='cancelled')).length;
  let html = `<div class="filterbar">
    <button class="btn btn-sm" onclick="openNew('${type}')">+ ${type==='invoice'?'חשבון חדש':'הצעת מחיר חדשה'}</button>
    <span class="chip" style="cursor:default">סגורים בארכיון: ${closedCount}</span>
  </div>`;
  if(!items.length){
    html += emptyState(type==='invoice'?'אין חשבונות פתוחים':'אין הצעות מחיר פתוחות', 'כל מה שנפתח יעבור לכאן עד שייסגר.');
    return html;
  }
  html += `<div class="tablewrap"><table><thead><tr>
    <th>כותרת</th><th>לקוח</th><th>סכום</th><th>סטטוס</th><th>אחראי</th><th>תאריך יעד</th><th>ימי עיכוב</th>
  </tr></thead><tbody>`;
  items.forEach(it=>{
    html += `<tr class="rowlink" onclick="openDetail('${it.id}')">
      <td>${escapeHtml(it.title)}</td>
      <td>${escapeHtml(it.client||'—')}</td>
      <td class="amount">${it.amount?'₪'+Number(it.amount).toLocaleString():'—'}</td>
      <td><span class="badge ${statusBadgeClass(it.status)}">${statusLabel(it.type,it.status)}</span></td>
      <td>${escapeHtml(it.assignee||'—')}</td>
      <td>${heDate(it.dueDate)}</td>
      <td>${it.rolloverCount>0?`<span class="overdue-flag">⏳ ${it.rolloverCount}</span>`:'—'}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

/* ============================= SUPPLIER BILLS (PAYMENTS) ============================= */
function renderSuppliersView(){
  const items = state.items.filter(i=>i.type==='supplier_bill' && i.status!=='done' && i.status!=='cancelled')
    .sort((a,b)=> (a.dueDate||'').localeCompare(b.dueDate||''));
  const closedCount = state.items.filter(i=>i.type==='supplier_bill' && (i.status==='done'||i.status==='cancelled')).length;
  const upcoming = upcomingPayments();

  let html = '';
  if(upcoming.length){
    html += `<div class="pay-banner">
      <span>⚠️</span>
      <div><b>${upcoming.length} תשלומים לספקים</b> מתקרבים או באיחור (עד ${PAYMENT_ALERT_DAYS} ימים קדימה)</div>
    </div>`;
  }
  html += `<div class="filterbar">
    <button class="btn btn-sm" onclick="openNew('supplier_bill')">+ חשבון ספק חדש</button>
    <button class="btn btn-sm" onclick="openSupplierDirectoryModal()">ניהול ספקים ותנאי תשלום</button>
    <span class="chip" style="cursor:default">סגורים בארכיון: ${closedCount}</span>
  </div>`;
  if(!items.length){
    html += emptyState('אין חשבונות ספק פתוחים', 'כל חשבונית שתכניס עם תאריך תשלום תופיע כאן, עם התראה שבוע מראש.');
    return html;
  }
  html += `<div class="tablewrap"><table><thead><tr>
    <th>ספק</th><th>תיאור</th><th>סכום</th><th>תנאי תשלום</th><th>אמצעי תשלום</th><th>תאריך לתשלום</th><th>נותר</th><th>סטטוס</th><th>אחראי</th><th>קובץ</th>
  </tr></thead><tbody>`;
  items.forEach(it=>{
    html += `<tr class="rowlink" onclick="openDetail('${it.id}')">
      <td>${escapeHtml(it.client||'—')}</td>
      <td>${escapeHtml(it.title)}</td>
      <td class="amount">${it.amount?'₪'+Number(it.amount).toLocaleString():'—'}</td>
      <td>${escapeHtml(it.terms||'—')}</td>
      <td>${PAY_METHOD_LABEL[it.paymentMethod||'']}</td>
      <td>${heDate(it.dueDate)}</td>
      <td>${countdownHtml(it.dueDate)}</td>
      <td><span class="badge ${statusBadgeClass(it.status)}">${statusLabel(it.type,it.status)}</span></td>
      <td>${escapeHtml(it.assignee||'—')}</td>
      <td>${it.fileData?'📎':'—'}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

/* ============================= SUPPLIER DIRECTORY (terms & method) ============================= */
function openSupplierDirectoryModal(){
  showModal(supplierDirectoryHtml());
}
function supplierDirectoryHtml(){
  const names = Object.keys(state.supplierDirectory).sort((a,b)=>a.localeCompare(b,'he'));
  let rows = names.map(name=>{
    const info = state.supplierDirectory[name];
    return `<div class="row2" style="align-items:end; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--line-soft)">
      <div style="grid-column:1/-1; font-weight:600; margin-bottom:4px">${escapeHtml(name)}</div>
      <label class="field"><b>תנאי תשלום</b>${termsSelectHtml('sd_'+cssSafe(name), info.terms||'')}</label>
      <label class="field"><b>אמצעי תשלום מועדף</b>${methodSelectHtml('sdm_'+cssSafe(name), info.method||'')}</label>
      <div style="display:flex; gap:8px; grid-column:1/-1">
        <button class="btn btn-sm btn-primary" onclick="saveSupplierDirectoryRow('${escapeAttr(name)}')">שמירה</button>
        <button class="btn btn-sm btn-danger" onclick="deleteSupplierDirectoryRow('${escapeAttr(name)}')">הסרת ספק מהרשימה</button>
      </div>
    </div>`;
  }).join('');
  if(!names.length) rows = `<div class="muted" style="margin-bottom:14px">אין עדיין ספקים שמורים — יתווספו אוטומטית בפעם הראשונה שתכניס חשבון ספק, או הוסף/י ידנית למטה.</div>`;
  return `
    <div class="modal-head"><h2>ניהול ספקים ותנאי תשלום</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p class="hint" style="margin-top:0">תנאי התשלום ואמצעי התשלום שנקבעים כאן יוצעו אוטומטית בפעם הבאה שמזינים חשבון לאותו ספק.</p>
    <div style="max-height:360px; overflow-y:auto; margin-bottom:14px">${rows}</div>
    <div class="row2" style="align-items:end">
      <label class="field"><b>הוספת ספק חדש</b><input type="text" id="sd_newname" placeholder="שם הספק"></label>
      <button class="btn btn-primary" onclick="addSupplierDirectoryRow()">הוספה</button>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">סגירה</button>
    </div>
  `;
}
function cssSafe(name){ return name.replace(/[^a-zA-Z0-9_-]/g,'_').replace(/^(\d)/,'_$1') || 'x'; }
function saveSupplierToFirestore(name){
  const info = state.supplierDirectory[name];
  if(!info || !window.__hub) return;
  const { db, doc, setDoc } = window.__hub;
  setDoc(doc(db, FS.suppliers, cssSafe(name)), { name, terms: info.terms||'', method: info.method||'' })
    .catch(e=>{ console.error('supplier save failed', e); showToast('שמירת הספק לשרת נכשלה'); });
}
function saveSupplierDirectoryRow(name){
  const terms = readTermsValue('sd_'+cssSafe(name));
  const method = document.getElementById('sdm_'+cssSafe(name)).value;
  upsertSupplierDirectory(name, terms, method);
  saveSupplierToFirestore(name);
  showToast('נשמר עבור '+name);
  showModal(supplierDirectoryHtml());
}
function deleteSupplierDirectoryRow(name){
  showConfirm(`להסיר את ${name} מרשימת הספקים? חשבונות קיימים לא יימחקו.`, ()=>{
    delete state.supplierDirectory[name];
    if(window.__hub){
      const { db, doc, deleteDoc } = window.__hub;
      deleteDoc(doc(db, FS.suppliers, cssSafe(name))).catch(e=>console.error('supplier delete failed', e));
    }
    showModal(supplierDirectoryHtml());
  }, 'הסרה');
}
function addSupplierDirectoryRow(){
  const inp = document.getElementById('sd_newname');
  const v = inp.value.trim();
  if(!v) return;
  upsertSupplierDirectory(v, '', '');
  saveSupplierToFirestore(v);
  showModal(supplierDirectoryHtml());
}

/* ============================= ARCHIVE ============================= */
function renderArchiveView(){
  let items = visibleItemsForRole(state.items).filter(i=>i.status==='done'||i.status==='cancelled');
  if(archiveFilter.type!=='all') items = items.filter(i=>i.type===archiveFilter.type);
  if(archiveFilter.assignee!=='all') items = items.filter(i=>i.assignee===archiveFilter.assignee);
  if(archiveFilter.from) items = items.filter(i=> (i.doneDate||'') >= archiveFilter.from);
  if(archiveFilter.to) items = items.filter(i=> (i.doneDate||'') <= archiveFilter.to);
  items = items.sort((a,b)=> (b.doneDate||'').localeCompare(a.doneDate||''));

  let html = `<div class="filterbar">
    ${chipGroup('type', ['all','task','reminder','invoice','quote','supplier_bill'], archiveFilter.type, 'archiveFilter')}
    ${assigneeFilterSelect(archiveFilter.assignee, 'onArchiveAssignee')}
    <input type="date" style="width:150px" value="${archiveFilter.from}" onchange="archiveFilter.from=this.value; render();">
    <input type="date" style="width:150px" value="${archiveFilter.to}" onchange="archiveFilter.to=this.value; render();">
    <button class="btn btn-sm" onclick="exportCsv()">ייצוא / העתקה</button>
  </div>`;

  if(!items.length){ html += emptyState('אין עדיין רשומות בארכיון', 'פריטים שיסומנו כהושלמו או בוטלו יופיעו כאן, עם תיעוד מלא של מי ומתי.'); return html; }

  html += `<div class="tablewrap"><table><thead><tr>
    <th>סוג</th><th>כותרת</th><th>לקוח</th><th>סטטוס סופי</th><th>בוצע ע״י</th><th>תאריך סגירה</th><th>נוצר בתאריך</th><th>ימי עיכוב</th>
  </tr></thead><tbody>`;
  items.forEach(it=>{
    html += `<tr class="rowlink" onclick="openDetail('${it.id}')">
      <td><span class="badge ${TYPE_BADGE_CLASS[it.type]}">${TYPE_LABEL[it.type]}</span></td>
      <td>${escapeHtml(it.title)}</td>
      <td>${escapeHtml(it.client||'—')}</td>
      <td><span class="badge ${statusBadgeClass(it.status)}">${statusLabel(it.type,it.status)}</span></td>
      <td>${escapeHtml(it.completedBy||it.assignee||'—')}</td>
      <td>${heDate(it.doneDate)}</td>
      <td>${heDate(it.createdDate)}</td>
      <td>${it.rolloverCount||0}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}
function onArchiveAssignee(v){ archiveFilter.assignee=v; render(); }

function exportCsv(){
  let items = state.items.filter(i=>i.status==='done'||i.status==='cancelled');
  const rows = [['סוג','כותרת','לקוח/ספק','סכום','תנאי תשלום','אמצעי תשלום','סטטוס','אחראי','בוצע ע"י','תאריך יעד','תאריך סגירה','נוצר בתאריך','ימי עיכוב','קובץ מצורף'].join('\t')];
  items.forEach(it=>{
    rows.push([TYPE_LABEL[it.type], it.title, it.client||'', it.amount||'', it.terms||'', PAY_METHOD_LABEL[it.paymentMethod||''], statusLabel(it.type,it.status), it.assignee||'', it.completedBy||'', it.dueDate||'', it.doneDate||'', it.createdDate||'', it.rolloverCount||0, it.fileName||''].join('\t'));
  });
  const csv = rows.join('\n');
  showModal(`
    <div class="modal-head"><h2>ייצוא ארכיון</h2><button class="modal-close" onclick="closeModal()">✕</button></div>

/* ============================= STATS ============================= */
function renderStatsView(){
  const today = todayStr();
  const open = state.items.filter(i=>i.status==='todo'||i.status==='doing');
  const overdue = open.filter(i=>i.rolloverCount>0);
  const doneThisWeek = state.items.filter(i=>i.status==='done' && i.doneDate && daysBetween(i.doneDate,today)<=7 && daysBetween(i.doneDate,today)>=0);
  const doneToday = state.items.filter(i=>i.status==='done' && i.doneDate===today);

  let html = `<div class="stats-grid">
    <div class="stat-card"><div class="n">${open.length}</div><div class="l">פריטים פתוחים כרגע</div></div>
    <div class="stat-card"><div class="n" style="color:var(--red)">${overdue.length}</div><div class="l">נדחו לפחות יום אחד</div></div>
    <div class="stat-card"><div class="n" style="color:var(--green)">${doneToday.length}</div><div class="l">הושלמו היום</div></div>
    <div class="stat-card"><div class="n">${doneThisWeek.length}</div><div class="l">הושלמו ב-7 ימים אחרונים</div></div>
  </div>`;

  html += `<div class="section-title">עומס פתוח לפי אחראי</div>`;
  const byAssignee = {};
  open.forEach(i=>{ const a=i.assignee||'לא משויך'; byAssignee[a]=(byAssignee[a]||0)+1; });
  const maxA = Math.max(1,...Object.values(byAssignee));
  html += `<div class="tablewrap" style="padding:16px 18px">`;
  if(!Object.keys(byAssignee).length){ html += `<div class="muted">אין נתונים עדיין</div>`; }
  Object.entries(byAssignee).sort((a,b)=>b[1]-a[1]).forEach(([name,count])=>{
    html += `<div class="bar-row"><div class="bar-label">${escapeHtml(name)}</div><div class="bar-track"><div class="bar-fill" style="width:${count/maxA*100}%"></div></div><div class="bar-val">${count}</div></div>`;
  });
  html += `</div>`;

  html += `<div class="section-title">השלמות ב-30 הימים האחרונים — לפי אחראי</div>`;
  const doneMonth = state.items.filter(i=>i.status==='done' && i.doneDate && daysBetween(i.doneDate,today)<=30 && daysBetween(i.doneDate,today)>=0);
  const byAssigneeDone = {};
  doneMonth.forEach(i=>{ const a=i.completedBy||i.assignee||'לא ידוע'; byAssigneeDone[a]=(byAssigneeDone[a]||0)+1; });
  const maxD = Math.max(1,...Object.values(byAssigneeDone));
  html += `<div class="tablewrap" style="padding:16px 18px">`;
  if(!Object.keys(byAssigneeDone).length){ html += `<div class="muted">אין נתונים עדיין</div>`; }
  Object.entries(byAssigneeDone).sort((a,b)=>b[1]-a[1]).forEach(([name,count])=>{
    html += `<div class="bar-row"><div class="bar-label">${escapeHtml(name)}</div><div class="bar-track"><div class="bar-fill" style="width:${count/maxD*100}%;background:var(--green)"></div></div><div class="bar-val">${count}</div></div>`;
  });
  html += `</div>`;
  return html;
}

/* ============================= INCOME / EXPENSE REPORT ============================= */
let reportsFilter = { period: 'last6m' };
const MONTH_NAMES_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function monthKey(dateStr){ return dateStr ? dateStr.slice(0,7) : null; }
function monthLabelHe(key){
  const parts = key.split('-');
  return MONTH_NAMES_HE[parseInt(parts[1],10)-1] + ' ' + parts[0];
}
function lastNMonthKeys(n){
  const keys = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const dt = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'));
  }
  return keys;
}
function periodRange(period){
  const today = new Date();
  if(period==='thisMonth'){
    return { from: today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-01', to: todayStr() };
  }
  if(period==='last3m'){
    const d = new Date(today.getFullYear(), today.getMonth()-2, 1);
    return { from: d.toISOString().slice(0,10), to: todayStr() };
  }
  if(period==='last6m'){
    const d = new Date(today.getFullYear(), today.getMonth()-5, 1);
    return { from: d.toISOString().slice(0,10), to: todayStr() };
  }
  if(period==='thisYear'){
    return { from: today.getFullYear()+'-01-01', to: todayStr() };
  }
  return { from: null, to: null }; // 'all'
}
function moneySum(arr){ return arr.reduce((s,i)=> s + (Number(i.amount)||0), 0); }
function fmtIls(n){ return '₪' + Math.round(n).toLocaleString(); }
function groupByPartner(items){
  const map = {};
  items.forEach(i=>{
    const key = i.client && i.client.trim() ? i.client.trim() : 'ללא שם';
    if(!map[key]) map[key] = { paid:0, pending:0 };
    const amt = Number(i.amount)||0;
    if(i.status==='done') map[key].paid += amt;
    else if(i.status==='todo'||i.status==='doing') map[key].pending += amt;
  });
  return map;
}
function renderPartnerTable(map, nameHeader){
  const rows = Object.entries(map).sort((a,b)=> (b[1].pending - a[1].pending) || (b[1].paid - a[1].paid));
  if(!rows.length) return `<div class="muted" style="padding:14px 4px">אין נתונים עדיין</div>`;
  let html = `<div class="tablewrap"><table><thead><tr><th>${nameHeader}</th><th>שולם</th><th>ממתין</th><th>סה"כ</th></tr></thead><tbody>`;
  rows.forEach(([name,v])=>{
    html += `<tr><td>${escapeHtml(name)}</td><td class="amount">${fmtIls(v.paid)}</td><td class="amount">${v.pending?fmtIls(v.pending):'—'}</td><td class="amount">${fmtIls(v.paid+v.pending)}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}
function renderReportsView(){
  const { from, to } = periodRange(reportsFilter.period);
  const inRange = (d)=> !!d && (!from || d>=from) && (!to || d<=to);

  const incomeDone = state.items.filter(i=>i.type==='invoice' && i.status==='done' && inRange(i.doneDate));
  const expenseDone = state.items.filter(i=>i.type==='supplier_bill' && i.status==='done' && inRange(i.doneDate));
  const incomeOpenAll = state.items.filter(i=>i.type==='invoice' && (i.status==='todo'||i.status==='doing'));
  const expenseOpenAll = state.items.filter(i=>i.type==='supplier_bill' && (i.status==='todo'||i.status==='doing'));

  const totalIncomeDone = moneySum(incomeDone);
  const totalExpenseDone = moneySum(expenseDone);
  const totalIncomeOpen = moneySum(incomeOpenAll);
  const totalExpenseOpen = moneySum(expenseOpenAll);
  const net = totalIncomeDone - totalExpenseDone;

  const periods = [['all','הכל'],['thisMonth','החודש הזה'],['last3m','3 חודשים'],['last6m','6 חודשים'],['thisYear','השנה']];

  let html = `<div class="filterbar">
    ${periods.map(([k,l])=>`<div class="chip ${reportsFilter.period===k?'active':''}" onclick="reportsFilter.period='${k}';render();">${l}</div>`).join('')}
    <button class="btn btn-sm" style="margin-right:auto" onclick="exportReportCsv()">ייצוא / העתקה</button>
  </div>`;

  html += `<div class="stats-grid">
    <div class="stat-card"><div class="n" style="color:var(--green)">${fmtIls(totalIncomeDone)}</div><div class="l">הכנסות שהתקבלו (בתקופה)</div></div>
    <div class="stat-card"><div class="n" style="color:var(--red)">${fmtIls(totalExpenseDone)}</div><div class="l">הוצאות ששולמו (בתקופה)</div></div>
    <div class="stat-card"><div class="n" style="color:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'':'-'}${fmtIls(Math.abs(net))}</div><div class="l">מאזן נטו (בתקופה)</div></div>
    <div class="stat-card"><div class="n">${fmtIls(totalIncomeOpen)}</div><div class="l">ממתין לגבייה מלקוחות (הכל)</div></div>
  </div>`;
  if(totalExpenseOpen>0){
    html += `<div class="stats-grid" style="grid-template-columns:1fr; margin-top:-10px">
      <div class="stat-card"><div class="n" style="color:var(--teal)">${fmtIls(totalExpenseOpen)}</div><div class="l">ממתין לתשלום לספקים (הכל)</div></div>
    </div>`;
  }

  html += `<div class="section-title">הכנסות מול הוצאות — 6 חודשים אחרונים</div>`;
  const months = lastNMonthKeys(6);
  const maxVal = Math.max(1, ...months.map(mk=>
    Math.max(
      moneySum(state.items.filter(i=>i.type==='invoice' && i.status==='done' && monthKey(i.doneDate)===mk)),
      moneySum(state.items.filter(i=>i.type==='supplier_bill' && i.status==='done' && monthKey(i.doneDate)===mk))
    )
  ));
  html += `<div class="tablewrap" style="padding:16px 18px">`;
  months.forEach(mk=>{
    const inc = moneySum(state.items.filter(i=>i.type==='invoice' && i.status==='done' && monthKey(i.doneDate)===mk));
    const exp = moneySum(state.items.filter(i=>i.type==='supplier_bill' && i.status==='done' && monthKey(i.doneDate)===mk));
    html += `<div style="margin-bottom:14px">
      <div style="font-weight:600; font-size:12.5px; margin-bottom:6px">${monthLabelHe(mk)}</div>
      <div class="bar-row"><div class="bar-label" style="color:var(--green)">הכנסות</div><div class="bar-track"><div class="bar-fill" style="width:${inc/maxVal*100}%;background:var(--green)"></div></div><div class="bar-val" style="width:auto">${fmtIls(inc)}</div></div>
      <div class="bar-row"><div class="bar-label" style="color:var(--red)">הוצאות</div><div class="bar-track"><div class="bar-fill" style="width:${exp/maxVal*100}%;background:var(--red)"></div></div><div class="bar-val" style="width:auto">${fmtIls(exp)}</div></div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="section-title">לפי לקוח — חשבונות לשליחה</div>`;
  html += renderPartnerTable(groupByPartner(state.items.filter(i=>i.type==='invoice')), 'לקוח');

  html += `<div class="section-title">לפי ספק — חשבונות לתשלום</div>`;
  html += renderPartnerTable(groupByPartner(state.items.filter(i=>i.type==='supplier_bill')), 'ספק');

  html += `<p class="hint">הסכומים מוצגים כפי שהוזנו בכל פריט (ללא חישוב מע"מ נפרד). "שולם/התקבל" מבוסס על פריטים שסומנו כהושלמו; "ממתין" מבוסס על פריטים פתוחים.</p>`;

  return html;
}
function exportReportCsv(){
  const rows = [['סוג','שם','שולם','ממתין','סה"כ'].join('\t')];
  const inc = groupByPartner(state.items.filter(i=>i.type==='invoice'));
  Object.entries(inc).forEach(([name,v])=> rows.push(['הכנסה', name, v.paid, v.pending, v.paid+v.pending].join('\t')));
  const exp = groupByPartner(state.items.filter(i=>i.type==='supplier_bill'));
  Object.entries(exp).forEach(([name,v])=> rows.push(['הוצאה', name, v.paid, v.pending, v.paid+v.pending].join('\t')));
  const csv = rows.join('\n');
  showModal(`
    <div class="modal-head"><h2>ייצוא דוח</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p class="hint" style="margin-top:0">העתק והדבק לאקסל (מופרד בטאבים).</p>
    <textarea class="csv-box" id="csvArea2" readonly>${csv}</textarea>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="copyReportCsv()">העתק ללוח</button>
      <button class="btn" onclick="closeModal()">סגור</button>
    </div>
  `);
}
function copyReportCsv(){
  const area = document.getElementById('csvArea2');
  area.select();
  try{ navigator.clipboard.writeText(area.value); showToast('הועתק ללוח'); }
  catch(e){ try{ document.execCommand('copy'); showToast('הועתק ללוח'); }catch(e2){ showToast('סמן/י ידנית והעתק/י (Ctrl+C)'); } }
}

function slugifyName(name){
  let slug = 'user';
  try{ slug = encodeURIComponent((name||'').trim()).replace(/[^a-zA-Z0-9]+/g,'_'); }catch(e){}
  slug = slug.replace(/^_+|_+$/g,'') || 'user';
  return slug.slice(0,40) + '_' + Math.random().toString(36).slice(2,7);
}
function addTeamMember(){
  const nameEl = document.getElementById('newMemberName');
  const pinEl = document.getElementById('newMemberPin');
  const roleEl = document.getElementById('newMemberRole');
  const activeEl = document.getElementById('newMemberActive');
  const name = nameEl.value.trim();
  const pin = (pinEl.value||'').trim();
  if(!name){ showToast('צריך שם'); return; }
  if(!/^\d{4}$/.test(pin)){ showToast('קוד PIN חייב להיות 4 ספרות'); return; }
  if(!window.__hub){ showToast('אין חיבור לשרת כרגע'); return; }
  const id = slugifyName(name);
  const { db, doc, setDoc } = window.__hub;
  setDoc(doc(db, FS.team, id), { name, pin, role: roleEl.value, active: !!activeEl.checked, createdAt: Date.now() })
    .then(()=>{ showToast('נוסף/ה בהצלחה'); render(); })
    .catch(e=>{ console.error('add member failed', e); showToast('שמירה נכשלה'); });
}
function updateUserRole(id, role){
  if(!window.__hub) return;
  const { db, doc, updateDoc } = window.__hub;
  updateDoc(doc(db, FS.team, id), { role }).catch(e=>{ console.error('role update failed', e); showToast('עדכון נכשל'); });
}
function updateUserActive(id, active){
  if(!window.__hub) return;
  const { db, doc, updateDoc } = window.__hub;
  updateDoc(doc(db, FS.team, id), { active }).catch(e=>{ console.error('active update failed', e); showToast('עדכון נכשל'); });
}
function updateUserPin(id){
  const el = document.getElementById('pin_'+id);
  const pin = (el.value||'').trim();
  if(!/^\d{4}$/.test(pin)){ showToast('קוד PIN חייב להיות 4 ספרות'); return; }
  if(!window.__hub) return;
  const { db, doc, updateDoc } = window.__hub;
  updateDoc(doc(db, FS.team, id), { pin }).then(()=>showToast('קוד עודכן')).catch(e=>{ console.error('pin update failed', e); showToast('עדכון נכשל'); });
}
function removeTeamMember(id, name){
  showConfirm(`למחוק את ${name} לצמיתות מרשימת הצוות? משימות קיימות שלו/שלה יישארו כמו שהן.`, ()=>{
    if(!window.__hub) return;
    const { db, doc, deleteDoc } = window.__hub;
    deleteDoc(doc(db, FS.team, id)).then(()=>showToast('נמחק')).catch(e=>{ console.error('delete member failed', e); showToast('מחיקה נכשלה'); });

}

function emptyState(big, small){
  return `<div class="empty"><div class="big">✓</div><div style="font-weight:600;margin-bottom:6px">${big}</div><div style="font-size:12.5px">${small}</div></div>`;
}
function truncate(s,n){ return s.length>n ? s.slice(0,n)+'…' : s; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

  `);
  document.getElementById('confirmYesBtn').onclick = function(){ closeModal(); onConfirm(); };
}
function confirmAsync(message){
  return new Promise(resolve=>{
    showModal(`

      <p style="margin-top:0">${escapeHtml(message)}</p>

}

const MAX_FILE_BYTES = 4*1024*1024; // 4MB soft cap — data lives in the browser's localStorage
function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}

/* ---------- file attachment storage: inline in hub_items when small, chunked into
   hub_filechunks (doc id `${itemId}_${index}`) when the base64 string is large ---------- */
async function saveChunkedFile(itemId, dataUrl){
  const { db, doc, writeBatch } = window.__hub;
  const total = Math.ceil(dataUrl.length / CHUNK_SIZE);
  const batch = writeBatch(db);
  for(let i=0;i<total;i++){
    const chunk = dataUrl.slice(i*CHUNK_SIZE, (i+1)*CHUNK_SIZE);
    batch.set(doc(db, FS.filechunks, `${itemId}_${i}`), { itemId, index:i, total, data:chunk });
  }
  await batch.commit();
  return total;
}
async function deleteChunkedFile(itemId, count){
  if(!count) return;
  const { db, doc, writeBatch } = window.__hub;
  const batch = writeBatch(db);
  for(let i=0;i<count;i++) batch.delete(doc(db, FS.filechunks, `${itemId}_${i}`));
  await batch.commit();
}
async function reassembleChunkedFile(itemId, count){
  const { db, doc, getDoc } = window.__hub;
  let combined = '';
  for(let i=0;i<count;i++){
    const snap = await getDoc(doc(db, FS.filechunks, `${itemId}_${i}`));
    if(snap.exists()) combined += snap.data().data;
  }
  return combined;
}
/* Writes the full item doc to hub_items, moving a large fileData string out into
   hub_filechunks first so the hub_items doc stays comfortably under Firestore's limit. */
async function writeItemFull(item){
  const { db, doc, setDoc } = window.__hub;
  const toSave = { ...item };
  if(item.fileData && item.fileData.length > CHUNK_SIZE){
    const count = await saveChunkedFile(item.id, item.fileData);
    toSave.fileData = '';
    toSave.fileChunked = true;
    toSave.fileChunkCount = count;
  } else {
    toSave.fileChunked = false;
    toSave.fileChunkCount = 0;
  }
  await setDoc(doc(db, FS.items, item.id), toSave);
}

async function submitNew(type){
  if(state.currentUserRole==='field' && FINANCIAL_TYPES.includes(type)){
    showToast('אין הרשאה ליצור פריט מסוג זה'); return;
  }
  const title = document.getElementById('f_title').value.trim();
  if(!title){ showToast('צריך כותרת'); return; }

  // capture every field value up-front — a nested confirm dialog below will replace
  // this form's HTML, so nothing here may be re-read from the DOM afterwards.
  const fields = {
    desc: document.getElementById('f_desc') ? document.getElementById('f_desc').value.trim() : '',
    client: document.getElementById('f_client') ? document.getElementById('f_client').value.trim() : '',
    amount: document.getElementById('f_amount') ? document.getElementById('f_amount').value : '',
    time: document.getElementById('f_time') ? document.getElementById('f_time').value : '',
    assignee: document.getElementById('f_assignee').value !== 'all' ? document.getElementById('f_assignee').value : '',
    priority: document.getElementById('f_priority').value,
    dueDate: document.getElementById('f_due').value || todayStr(),
    terms: readTermsValue('f_terms'),
    paymentMethod: document.getElementById('f_method') ? document.getElementById('f_method').value : '',
  };

  let fileData='', fileName='', fileType='';
  const fileInput = document.getElementById('f_file');
  if(fileInput && fileInput.files && fileInput.files[0]){
    const file = fileInput.files[0];
    if(file.size > MAX_FILE_BYTES){
      const proceed = await confirmAsync('הקובץ גדול (מעל 4MB) — הסנכרון לשרת עשוי לקחת רגע. להמשיך בכל זאת?');
      if(!proceed) return;
    }
    try{
      fileData = await readFileAsDataURL(file);
      fileName = file.name;
      fileType = file.type;
    }catch(e){ showToast('שגיאה בצירוף הקובץ — נשמר בלי הקובץ'); }
  }

  const item = {
    id: uid(), type,
    title,
    desc: fields.desc, client: fields.client, amount: fields.amount, time: fields.time,
    assignee: fields.assignee, priority: fields.priority, dueDate: fields.dueDate,
    status: 'todo',
    createdDate: todayStr(),
    activeDate: todayStr(),
    doneDate: '',
    completedBy: '',
    rolloverCount: 0,
    fileData, fileName, fileType, fileChunked:false, fileChunkCount:0,
    terms: fields.terms, paymentMethod: fields.paymentMethod,
    log: [],
  };
  if(type==='supplier_bill' && item.client){
    upsertSupplierDirectory(item.client, fields.terms, fields.paymentMethod);
    saveSupplierToFirestore(item.client);
  }
  addLog(item, `נוצר ע״י ${state.currentUser}`);
  state.items.push(item); // immediate responsiveness; the onSnapshot echo below is idempotent
  closeModal();
  showToast('נשמר');
  render();
  try{
    await writeItemFull(item);
  }catch(e){
    console.error('item write failed', e);
    showToast('השמירה לשרת נכשלה — בדוק/י חיבור לאינטרנט ונסה/י שוב');
  }
}

    const chunkCount = it.fileChunkCount;
    it.fileData=''; it.fileName=''; it.fileType=''; it.fileChunked=false; it.fileChunkCount=0;
