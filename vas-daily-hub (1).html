<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרכז המשימות היומי — VAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12161d;
  --panel:#1a202b;
  --panel2:#212938;
  --line:#2b3444;
  --line-soft:#232b39;
  --text:#e8ecf3;
  --text-dim:#93a0b4;
  --text-faint:#5f6c80;
  --accent:#e08a3c;
  --accent-soft:#3a2c1c;
  --blue:#5a8dee;
  --blue-soft:#1c2740;
  --purple:#a37fe0;
  --purple-soft:#2a2140;
  --teal:#3fb6b0;
  --teal-soft:#163632;
  --green:#48b57a;
  --green-soft:#173328;
  --red:#e0605a;
  --red-soft:#3a1f1e;
  --amber:#e0b84a;
  --amber-soft:#3a2f16;
  --radius:10px;
  --font: 'Rubik', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
:root[data-theme="light"]{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f4; --line:#dbe0e8; --line-soft:#e7eaef;
  --text:#1c2330; --text-dim:#5a6577; --text-faint:#8b95a5;
  --accent-soft:#fbe7d2; --blue-soft:#e1eaff; --purple-soft:#ece3fb; --green-soft:#dff4e8; --red-soft:#fbe1e0; --amber-soft:#faf0d4; --teal-soft:#dcf3f1;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f4; --line:#dbe0e8; --line-soft:#e7eaef;
    --text:#1c2330; --text-dim:#5a6577; --text-faint:#8b95a5;
    --accent-soft:#fbe7d2; --blue-soft:#e1eaff; --purple-soft:#ece3fb; --green-soft:#dff4e8; --red-soft:#fbe1e0; --amber-soft:#faf0d4; --teal-soft:#dcf3f1;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  display:flex; min-height:100vh; font-size:14.5px; line-height:1.5;
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- layout ---------- */
.app{display:flex; width:100%; min-height:100vh;}
.sidebar{
  width:230px; flex:0 0 230px; background:var(--panel); border-left:1px solid var(--line);
  padding:18px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px 8px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#c9631f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1206;flex:none;font-size:15px;}
.brand-text .t1{font-weight:700;font-size:14.5px;}
.brand-text .t2{font-size:11.5px;color:var(--text-faint);}
.navgroup{margin-top:10px;}
.navlabel{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;padding:10px 10px 4px;}
.navitem{
  display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; border-radius:8px;
  cursor:pointer; color:var(--text-dim); font-weight:500; transition:background .12s;
}
.navitem:hover{background:var(--panel2);}
.navitem.active{background:var(--accent-soft); color:var(--accent);}
.navitem .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.navitem .label{display:flex;align-items:center;gap:9px;}
.navbadge{
  font-family:var(--mono); font-size:11px; background:var(--panel2); color:var(--text-dim);
  border-radius:20px; padding:1px 7px; min-width:20px; text-align:center;
}
.navitem.active .navbadge{background:rgba(224,138,60,.22); color:var(--accent);}
.navbadge.warn{background:var(--red-soft); color:var(--red);}
.sidebar-foot{margin-top:auto; padding-top:12px; border-top:1px solid var(--line-soft);}
.who-select{width:100%;}

.main{flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; overflow-y:auto;}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  padding:16px 26px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
}
.topbar h1{font-size:19px; margin:0; font-weight:700;}
.topbar .sub{font-size:12.5px; color:var(--text-faint); margin-top:2px;}
.topbar-actions{display:flex; gap:8px; align-items:center;}
.content{padding:22px 26px 60px;}

/* ---------- controls ---------- */
button{font-family:var(--font); cursor:pointer;}
.btn{
  border:1px solid var(--line); background:var(--panel); color:var(--text); padding:8px 14px;
  border-radius:8px; font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; gap:6px; transition:.12s;
}
.btn:hover{border-color:var(--text-faint);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#1a1206; font-weight:700;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-dim);}
.btn-ghost:hover{background:var(--panel2); color:var(--text);}
.btn-danger{color:var(--red); border-color:var(--red-soft); background:var(--red-soft);}
.btn-sm{padding:5px 10px; font-size:12.5px; border-radius:7px;}
select,input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],textarea{
  background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px;
  padding:8px 10px; font-family:var(--font); font-size:13.5px; width:100%;
}
textarea{resize:vertical; min-height:64px;}
label.field{display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--text-dim); margin-bottom:12px;}
label.field b{color:var(--text); font-weight:600; font-size:12.5px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px; border:1px solid var(--line);
  background:var(--panel); color:var(--text-dim); font-size:12.5px; cursor:pointer; font-weight:500;
}
.chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
.filterbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}

/* ---------- badges ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;}
.b-task{background:var(--blue-soft); color:var(--blue);}
.b-reminder{background:var(--amber-soft); color:var(--amber);}
.b-invoice{background:var(--purple-soft); color:var(--purple);}
.b-quote{background:var(--green-soft); color:var(--green);}
.b-supplier_bill{background:var(--teal-soft); color:var(--teal);}
.b-todo{background:var(--panel2); color:var(--text-dim);}
.b-doing{background:var(--amber-soft); color:var(--amber);}
.b-done{background:var(--green-soft); color:var(--green);}
.b-cancelled{background:var(--red-soft); color:var(--red);}
.b-urgent{background:var(--red-soft); color:var(--red);}

/* ---------- board ---------- */
.board{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; align-items:start;}
@media(max-width:980px){.board{grid-template-columns:1fr;}}
.col{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px; min-height:80px;}
.col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 4px;}
.col-head h3{font-size:13.5px; margin:0; font-weight:700;}
.col-count{font-family:var(--mono); font-size:11.5px; color:var(--text-faint);}
.card{
  background:var(--panel2); border:1px solid var(--line-soft); border-radius:9px; padding:11px 12px; margin-bottom:9px;
  cursor:pointer; transition:.12s; border-right:3px solid var(--line);
}
.card:hover{border-color:var(--text-faint); transform:translateY(-1px);}
.card.type-task{border-right-color:var(--blue);}
.card.type-reminder{border-right-color:var(--amber);}
.card.type-invoice{border-right-color:var(--purple);}
.card.type-supplier_bill{border-right-color:var(--teal);}
.card.type-quote{border-right-color:var(--green);}
.card.overdue{box-shadow:inset 0 0 0 1px var(--red-soft);}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px;}
.card-title{font-weight:600; font-size:13.5px; line-height:1.35;}
.card-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; font-size:11.5px; color:var(--text-faint);}
.card-meta span{display:inline-flex; align-items:center; gap:4px;}
.card-actions{display:flex; gap:6px; margin-top:9px;}
.overdue-flag{color:var(--red); font-size:11px; font-weight:700; display:flex; align-items:center; gap:4px;}
.empty-col{padding:18px 6px; text-align:center; color:var(--text-faint); font-size:12.5px;}

/* ---------- payment alert banner ---------- */
.pay-banner{
  display:flex; align-items:center; gap:12px; background:var(--red-soft); border:1px solid var(--red);
  border-radius:9px; padding:12px 16px; margin-bottom:20px; color:var(--text);
}
.pay-banner b{color:var(--red);}
.pay-banner .btn{margin-inline-start:auto;}
.attach-box{
  display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px dashed var(--line);
  border-radius:8px; padding:9px 11px; font-size:12.5px; margin-bottom:12px;
}
.attach-box a{color:var(--blue); text-decoration:none; font-weight:600;}
.countdown{font-family:var(--mono); font-weight:700; font-size:12px;}
.cd-ok{color:var(--text-faint);}
.cd-soon{color:var(--amber);}
.cd-urgent{color:var(--red);}

/* ---------- reminder strip ---------- */
.reminder-strip{display:flex; flex-direction:column; gap:8px; margin-bottom:22px;}
.reminder-row{
  display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
  border-radius:9px; padding:10px 14px;
}
.reminder-row.done{opacity:.5;}
.reminder-time{font-family:var(--mono); font-weight:700; color:var(--amber); font-size:13px; min-width:52px;}
.reminder-title{flex:1; font-weight:500; font-size:13.5px;}
.check{
  width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line); background:var(--panel2);
  display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer; font-size:13px;
}
.check.checked{background:var(--green); border-color:var(--green); color:#08210f;}

/* ---------- lists (invoices/quotes/archive) ---------- */
.tablewrap{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:right; font-size:11.5px; color:var(--text-faint); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--panel2); white-space:nowrap;}
td{padding:10px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover td{background:var(--panel2);}
.amount{font-family:var(--mono); font-weight:600;}
.muted{color:var(--text-faint);}
.section-title{font-size:15px; font-weight:700; margin:26px 0 12px; display:flex; align-items:center; gap:8px;}
.section-title:first-child{margin-top:0;}

/* ---------- stat cards ---------- */
.stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
.stat-card .n{font-size:26px; font-weight:800; font-family:var(--mono);}
.stat-card .l{font-size:12px; color:var(--text-faint); margin-top:4px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
.bar-label{width:90px; font-size:12.5px; color:var(--text-dim); flex:none;}
.bar-track{flex:1; height:16px; background:var(--panel2); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent); border-radius:4px;}
.bar-val{width:26px; text-align:left; font-family:var(--mono); font-size:12px; color:var(--text-faint);}

/* ---------- empty state ---------- */
.empty{text-align:center; padding:50px 20px; color:var(--text-faint);}
.empty .big{font-size:34px; margin-bottom:10px;}

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(8,10,14,.62); display:none; align-items:flex-start; justify-content:center;
  z-index:100; padding:5vh 16px; overflow-y:auto;
}
.overlay.show{display:flex;}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:14px; width:100%; max-width:560px; padding:22px 24px; box-shadow:0 20px 60px rgba(0,0,0,.4);}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.modal-head h2{font-size:16.5px; margin:0;}
.modal-close{background:none; border:none; color:var(--text-faint); font-size:20px; line-height:1; padding:2px 6px;}
.type-tabs{display:flex; gap:6px; margin-bottom:16px;}
.type-tab{flex:1; text-align:center; padding:9px 6px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:12.5px; font-weight:600; color:var(--text-dim);}
.type-tab.active.t-task{border-color:var(--blue); color:var(--blue); background:var(--blue-soft);}
.type-tab.active.t-reminder{border-color:var(--amber); color:var(--amber); background:var(--amber-soft);}
.type-tab.active.t-invoice{border-color:var(--purple); color:var(--purple); background:var(--purple-soft);}
.type-tab.active.t-supplier_bill{border-color:var(--teal); color:var(--teal); background:var(--teal-soft);}
.type-tab.active.t-quote{border-color:var(--green); color:var(--green); background:var(--green-soft);}
.modal-foot{display:flex; justify-content:space-between; gap:10px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line-soft);}
.status-btns{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.status-btn{padding:7px 12px; border-radius:7px; border:1px solid var(--line); background:var(--panel2); color:var(--text-dim); font-size:12.5px; font-weight:600;}
.status-btn.active{background:var(--accent); border-color:var(--accent); color:#1a1206;}
.log-list{max-height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-top:6px;}
.log-item{font-size:12px; color:var(--text-dim); background:var(--panel2); border-radius:7px; padding:8px 10px;}
.log-item b{color:var(--text);}
.log-ts{color:var(--text-faint); font-family:var(--mono); font-size:10.5px;}
.detail-meta{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.hint{font-size:11.5px; color:var(--text-faint); margin-top:-6px; margin-bottom:12px;}
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line);
  color:var(--text); padding:10px 18px; border-radius:9px; font-size:13px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.3);
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
.csv-box{width:100%; height:180px; font-family:var(--mono); font-size:11.5px; direction:ltr; text-align:left;}

/* ---------- login screen ---------- */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg);}
.login-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px 28px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.35);}
.login-brand{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
.login-brand .brand-mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#c9631f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1206;font-size:18px;flex:none;}
.login-brand .t1{font-weight:700; font-size:16.5px;}
.login-brand .t2{font-size:12px; color:var(--text-faint);}
.login-status{text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13.5px;}
.login-form input[type=email],.login-form input[type=password]{direction:ltr; text-align:left;}
.login-link{background:none; border:none; color:var(--blue); font-size:12.5px; padding:6px 0 0; display:block; margin:8px auto 0; text-decoration:underline; cursor:pointer;}
.login-ok{color:var(--green); font-size:12.5px; text-align:center; margin-top:10px;}
.pw-checklist{list-style:none; margin:-4px 0 12px; padding:0; font-size:12px; display:grid; grid-template-columns:1fr 1fr; gap:3px 12px;}
.pw-checklist li.ok{color:var(--green);}
.pw-checklist li.bad{color:var(--text-faint);}
.team-row-email{direction:ltr; unicode-bidi:isolate; font-family:var(--mono); font-size:11.5px; color:var(--text-faint);}
.login-error{color:var(--red); font-size:12.5px; text-align:center; margin-top:10px; min-height:16px;}
.login-btn{width:100%; margin-top:16px;}
.role-badge{display:inline-flex; align-items:center; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px;}
.role-badge.manager{background:var(--accent-soft); color:var(--accent);}
.role-badge.office{background:var(--blue-soft); color:var(--blue);}
.role-badge.field{background:var(--green-soft); color:var(--green);}
.whoami{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9px; background:var(--panel2); margin-bottom:8px;}
.whoami .name{font-weight:600; font-size:13px; flex:1;}
.session-note{font-size:11px; color:var(--text-faint); text-align:center; margin-top:14px; line-height:1.5;}

/* =====================================================================
   ADDED — mobile-first responsiveness, view-toggle, icon system, polish
   (visual/markup layer only — see accompanying <script> additions, which
   are limited to small additive display-preference helpers)
   ===================================================================== */

/* ---------- inline icon system ---------- */
.icon{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;display:inline-block;}
.icon-sm{width:13px;height:13px;}
.icon-lg{width:20px;height:20px;}

/* ---------- mobile menu button (hidden on desktop) ---------- */
.mobile-menu-btn{
  display:none; align-items:center; justify-content:center; width:38px; height:38px; flex:none;
  border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--text);
}
.sidebar-scrim{display:none;}

/* ---------- view-mode toggle (cards / table) ---------- */
.vt-toggle{display:inline-flex; gap:2px; padding:3px; border:1px solid var(--line); border-radius:9px; background:var(--panel);}
.vt-btn{
  display:flex; align-items:center; justify-content:center; width:32px; height:30px; border-radius:6px;
  border:none; background:transparent; color:var(--text-faint);
}
.vt-btn.active{background:var(--accent-soft); color:var(--accent);}
.vt-cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px;}
.vt-cardgrid .card{margin-bottom:0;}

/* ---------- premium send-to-field button + badge ---------- */
.btn-vasapp{
  background:linear-gradient(135deg, var(--blue), #3f6fd1); border-color:transparent; color:#fff; font-weight:700;
  box-shadow:0 4px 14px rgba(90,141,238,.28);
}
.btn-vasapp:hover{filter:brightness(1.07); box-shadow:0 6px 18px rgba(90,141,238,.36);}
.vasapp-badge{
  display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--blue-soft); color:var(--blue);
  border:1px solid rgba(90,141,238,.35); border-radius:11px; padding:9px 12px; font-size:12.5px; margin-bottom:14px;
}
.vasapp-badge .vb-icon{
  display:flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:8px;
  background:var(--blue); color:#fff; flex:none;
}
.vasapp-badge b{color:var(--text);}
.vasapp-live{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}
.vasapp-live .dot-live{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 3px var(--green-soft);}

/* ---------- push-dialog polish ---------- */
.va-mode-card{
  border:1px solid var(--line); border-radius:11px; padding:14px; background:var(--panel2); margin-top:2px;
}

/* ---------- table scroll affordance ---------- */
.tablewrap{position:relative;}
.tablewrap-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}

/* =====================================================================
   Tablet tier
   ===================================================================== */
@media(max-width:900px){
  .sidebar{width:190px; flex:0 0 190px; padding:14px 10px;}
  .content{padding:18px 16px 50px;}
  .topbar{padding:14px 16px;}
}

/* =====================================================================
   Mobile tier — no horizontal scroll, stacked controls, drawer sidebar

<script type="module">
/* ============================= FIREBASE BRIDGE ============================= */
/* Loads the Firebase modular SDK from a CDN and exposes a small bridge object
   (window.__hub) that the classic script below uses. Once the bridge is ready it calls
   window.__hubBridgeReady(), and the classic script subscribes to onAuthStateChanged
   itself. The hub's own (default) app uses REAL Firebase Email/Password auth — there is
   no anonymous sign-in on this app anymore. */
import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, initializeAuth, inMemoryPersistence, onAuthStateChanged,
  signInWithEmailAndPassword, signOut, sendPasswordResetEmail, createUserWithEmailAndPassword,
  updatePassword, reauthenticateWithCredential, EmailAuthProvider
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
  onSnapshot, query, where, writeBatch, serverTimestamp, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const BUILTIN_FB = {
  apiKey: "AIzaSyC7J0s6YXQBtlezzK88-9bhRjG-c_Sl4gU",
  authDomain: "vas--system.firebaseapp.com",
  projectId: "vas--system",
  storageBucket: "vas--system.firebasestorage.app",
  messagingSenderId: "558157805234",
  appId: "1:558157805234:web:e9f4e6809fe82329533bab"
};

try{
  const fbApp = initializeApp(BUILTIN_FB);
  const auth = getAuth(fbApp);
  try{ auth.languageCode = 'he'; }catch(e){} // password-reset emails in Hebrew
  const db = getFirestore(fbApp);

  /* Secondary, in-memory-only auth instance used ONLY by the manager's "add user" flow:
     creating an account on the primary auth would sign the manager out and in as the new
     user. The secondary instance is never persisted to disk and is signed out right after. */
  let adminCreateAuth = null;
  function getSecondaryAuth(){
    if(adminCreateAuth) return adminCreateAuth;
    let app2;
    try{ app2 = getApp('hub-admin-create'); }catch(e){ app2 = initializeApp(BUILTIN_FB, 'hub-admin-create'); }
    try{ adminCreateAuth = initializeAuth(app2, { persistence: inMemoryPersistence }); }
    catch(e){ adminCreateAuth = getAuth(app2); }
    return adminCreateAuth;
  }

  window.__hub = {
    db, auth, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
    onSnapshot, query, where, writeBatch, serverTimestamp,
    onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail,
    createUserWithEmailAndPassword, updatePassword, reauthenticateWithCredential,
    EmailAuthProvider, getSecondaryAuth
  };
  if(typeof window.__hubBridgeReady === 'function') window.__hubBridgeReady();
}catch(err){
  console.error('Firebase init failed', err);
  if(typeof window.__hubAuthError === 'function') window.__hubAuthError(err);
}

/* ---- Second, fully separate Firebase app instance: vas-app's own Firestore project
   (vas-schedule). This is a manual push/sync integration into a different, already-live
   field app — kept under its own named app instance so an outage or auth failure here
   can NEVER affect the hub's own default Firebase connection above. Every failure path
   below just disables the vas-app feature (toast) instead of throwing. ---- */
const VASAPP_FB = {
  apiKey: "AIzaSyD0_Ji35W2rlaqYjYRqAU-sTksZm0CRDaY",
  authDomain: "vas-schedule.firebaseapp.com",
  projectId: "vas-schedule",
  storageBucket: "vas-schedule.firebasestorage.app",
  messagingSenderId: "763095300879",
  appId: "1:763095300879:web:7d42c00f856ba8fd365c7a"
};

try{
  const vaApp = initializeApp(VASAPP_FB, 'vasapp');
  const vaAuth = getAuth(vaApp);
  const vaDb = getFirestore(vaApp);

  window.__vasapp = {
    db: vaDb, auth: vaAuth, signInWithEmailAndPassword, signOut,
    collection, doc, getDoc, getDocs, setDoc, updateDoc, onSnapshot, runTransaction
  };

  /* vas-app itself only accepts real Email/Password users (its own team accounts on the
     vas-schedule project), so the hub signs in there with the office/manager's vas-app
     credentials. The session is remembered per browser under this named app. */
  onAuthStateChanged(vaAuth, (user)=>{
    if(user && !user.isAnonymous){
      if(typeof window.__vasAppReady === 'function') window.__vasAppReady(user);
    } else {
      if(user && user.isAnonymous){ signOut(vaAuth).catch(()=>{}); }
      if(typeof window.__vasAppSignedOut === 'function') window.__vasAppSignedOut();
    }
  });
}catch(err){
  console.error('vas-app Firebase init failed', err);
  if(typeof window.__vasAppError === 'function') window.__vasAppError(err);
}
</script>

<script>
/* ============================= DATA LAYER ============================= */
/* Source of truth is now Firestore (collections prefixed hub_). `state` below is the
   in-memory cache the render functions read; it is populated live from onSnapshot
   listeners set up in the AUTH / LOGIN / SYNC section further down. */
const FS = {
  team: 'hub_team',
  items: 'hub_items',
  suppliers: 'hub_suppliers',
  customers: 'hub_customers',
  filechunks: 'hub_filechunks'
};
const CHUNK_SIZE = 700*1024; // ~700KB per chunk, safely under Firestore's ~1MiB doc limit

/* ===== OWNER EMAIL — change here if the owner's login email ever changes =====
   On the first login of this address, if hub_team/{email} does not exist yet, the app
   creates it automatically as an active manager (the ONLY auto-created account). The
   same address is hard-coded in hub-firestore-rules.txt (hubIsOwner) — keep both in sync. */
const HUB_OWNER_EMAIL = 'avishay@s-vsecurity.com';

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function daysUntil(dateStr){ if(!dateStr) return null; return daysBetween(todayStr(), dateStr); }
const TERMS_PRESETS = ['מזומן','שוטף','שוטף+15','שוטף+30','שוטף+45','שוטף+60','שוטף+90','אחר'];
const PAY_METHOD_LABEL = { credit:'אשראי', transfer:'העברה בנקאית', '':'לא נבחר' };
function parseTermsDays(terms){
  if(!terms) return null;
  if(terms==='מזומן') return 0;
  const m = terms.match(/שוטף\s*\+?\s*(\d+)/);
  return m ? parseInt(m[1],10) : null;
}
function getSupplierInfo(name){
  if(!name) return null;
  return state.supplierDirectory[name.trim()] || null;
}
function upsertSupplierDirectory(name, terms, method){
  if(!name) return;
  const key = name.trim();
  if(!key) return;
  state.supplierDirectory[key] = { terms: terms||'', method: method||'' };
}
function supplierDatalistHtml(){
  return `<datalist id="supplierDatalist">${Object.keys(state.supplierDirectory).map(n=>`<option value="${escapeAttr(n)}">`).join('')}</datalist>`;
}
/* ---- customer directory: same shape/spirit as the supplier directory above, but a
   separate collection/state object — customers and suppliers are different concepts and
   must never be mixed into one datalist or one Firestore collection. No auto-fill on pick:
   unlike suppliers (which prefill payment terms), picking a customer only fills the name. */
function customerDatalistHtml(){
  return `<datalist id="customerDatalist">${Object.keys(state.customerDirectory).map(n=>`<option value="${escapeAttr(n)}">`).join('')}</datalist>`;
}
/* NOTE: deliberately NOT reusing cssSafe() (used for supplier doc ids) here — cssSafe()
   collapses every non-Latin character to '_', so two different Hebrew customer names of
   the same length would collide onto the same Firestore doc and silently overwrite each
   other. Firestore doc ids accept Unicode directly (only '/' and a couple of reserved
   patterns are disallowed), so we just sanitize those and keep the name intact. */
function customerDocId(name){
  let id = (name||'').trim().replace(/[\/\r\n]+/g,'_');
  if(!id) return 'x';
  if(/^\.+$/.test(id)) id = 'dot_'+id; // avoid the reserved "." / ".." doc ids
  return id.slice(0,400); // stay comfortably under Firestore's 1500-byte doc id limit
}
function getCustomerInfo(name){
  if(!name) return null;
  return state.customerDirectory[name.trim()] || null;
}
function upsertCustomerDirectory(name, fields){
  fields = fields || {};
  if(!name) return;
  const key = name.trim();
  if(!key) return;
  state.customerDirectory[key] = {
    name: key,
    phone: (fields.phone||'').trim(),
    email: (fields.email||'').trim(),
    contact: (fields.contact||'').trim(),
    city: (fields.city||'').trim(),
    vatId: (fields.vatId||'').trim(),
    notes: (fields.notes||'').trim(),
  };
}
function saveCustomerToFirestore(name){
  const info = state.customerDirectory[name];
  if(!info || !window.__hub) return;
  if(state.currentUserRole!=='manager') return; // hub_customers: only managers write
  const { db, doc, setDoc, serverTimestamp } = window.__hub;
  setDoc(doc(db, FS.customers, customerDocId(name)), {
    name, phone: info.phone||'', email: info.email||'', contact: info.contact||'',
    city: info.city||'', vatId: info.vatId||'', notes: info.notes||'',
    updatedAt: serverTimestamp(), updatedBy: state.currentUser||''
  }, { merge:true }).catch(e=>{ console.error('customer save failed', e); showToast('שמירת הלקוח לשרת נכשלה'); });
}
function termsSelectHtml(id, current){
  const isPreset = TERMS_PRESETS.includes(current);
  const customVal = (!isPreset && current) ? current : '';
  return `<select id="${id}" onchange="document.getElementById('${id}_custom').style.display = this.value==='אחר' ? 'block':'none'">
      ${TERMS_PRESETS.map(t=>`<option value="${t}" ${(current===t || (!isPreset && t==='אחר'))?'selected':''}>${t}</option>`).join('')}
    </select>
    <input type="text" id="${id}_custom" placeholder="פירוט תנאי תשלום" value="${escapeAttr(customVal)}" style="margin-top:6px; display:${(!isPreset && current)?'block':'none'}">`;
}
function methodSelectHtml(id, current){
  return `<select id="${id}">
      <option value="" ${!current?'selected':''}>לא נבחר</option>
      <option value="credit" ${current==='credit'?'selected':''}>אשראי</option>
      <option value="transfer" ${current==='transfer'?'selected':''}>העברה בנקאית</option>
    </select>`;
}
function readTermsValue(selectId){
  const sel = document.getElementById(selectId);
  if(!sel) return '';
  if(sel.value==='אחר'){
    const custom = document.getElementById(selectId+'_custom');
    return custom ? custom.value.trim() : '';
  }
  return sel.value;
}
function setTermsFieldValue(selectId, termsStr){
  const sel = document.getElementById(selectId);
  const custom = document.getElementById(selectId+'_custom');
  if(!sel || !termsStr) return;
  if(TERMS_PRESETS.includes(termsStr)){
    sel.value = termsStr;
    if(custom) custom.style.display='none';
  } else {
    sel.value = 'אחר';
    if(custom){ custom.value = termsStr; custom.style.display='block'; }
  }
}
function onSupplierPick(prefix){
  const clientEl = document.getElementById(prefix+'_client');
  if(!clientEl) return;
  const info = getSupplierInfo(clientEl.value);
  if(!info) return;
  const termsSel = document.getElementById(prefix+'_terms');
  const termsCustom = document.getElementById(prefix+'_terms_custom');
  const methodSel = document.getElementById(prefix+'_method');
  if(termsSel){
    if(TERMS_PRESETS.includes(info.terms)){
      termsSel.value = info.terms;
      if(termsCustom) termsCustom.style.display='none';
    } else if(info.terms){
      termsSel.value = 'אחר';
      if(termsCustom){ termsCustom.value = info.terms; termsCustom.style.display='block'; }
    }
  }  if(methodSel) methodSel.value = info.method || '';
  if(prefix==='f'){
    const days = parseTermsDays(info.terms);
    if(days!==null){
      const dueEl = document.getElementById('f_due');
      if(dueEl){
        const d = new Date(); d.setDate(d.getDate()+days);
        dueEl.value = d.toISOString().slice(0,10);
      }
    }
  }
}
function overdueItems(){
  const today = todayStr();
  return state.items.filter(i=> (i.status==='todo'||i.status==='doing') && i.rolloverCount>0 && i.activeDate<=today)
    .sort((a,b)=> (b.rolloverCount||0) - (a.rolloverCount||0));
}
function upcomingPayments(){
  const today = todayStr();
  return state.items.filter(i=>{
    if(i.type!=='supplier_bill') return false;
    if(i.status==='done'||i.status==='cancelled') return false;
    const d = daysUntil(i.dueDate);
    return d!==null && d<=PAYMENT_ALERT_DAYS;
  }).sort((a,b)=> (a.dueDate||'').localeCompare(b.dueDate||''));
}
function countdownHtml(dueDate){
  const d = daysUntil(dueDate);
  if(d===null) return '<span class="countdown cd-ok">—</span>';
  if(d<0) return `<span class="countdown cd-urgent">באיחור ${-d} ימים</span>`;
  if(d===0) return `<span class="countdown cd-urgent">היום!</span>`;
  if(d<=PAYMENT_ALERT_DAYS) return `<span class="countdown cd-soon">בעוד ${d} ימים</span>`;
  return `<span class="countdown cd-ok">בעוד ${d} ימים</span>`;
}
function uid(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowTs(){ const d=new Date(); return d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }
function heDate(dstr){
  if(!dstr) return '—';
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('he-IL',{weekday:'short', day:'numeric', month:'short'});
}

let state = {
  items: [],              // live cache of hub_items docs
  users: [],              // live cache of hub_team docs (id = lowercase email; legacy PIN docs too, for cleanup)
  team: [],               // derived: names of ACTIVE hub_team docs (what the UI reads)
  supplierDirectory: {},  // derived: { supplierName: {terms, method} } from hub_suppliers
  customerDirectory: {},  // derived: { customerName: {name,phone,email,contact,city,vatId,notes} } from hub_customers
  currentUser: '',        // logged-in person's display name (audit-log actor)
  currentUserId: '',      // logged-in person's lowercase email (= hub_team doc id)
  currentUserRole: '',    // 'manager' | 'office' | 'field'
};

/* ---- rollover engine: anything not done/cancelled and dated before today jumps to today.
   The once-per-day gate is intentionally LOCAL (per device), not shared via Firestore —
   a small risk of double-incrementing rolloverCount across simultaneous devices right at
   midnight is an accepted tradeoff, not worth over-engineering. ---- */
const ROLLOVER_GATE_KEY = 'vas_hub_rollover_date';
function runRollover(){
  const today = todayStr();
  let lastGate;
  try{ lastGate = localStorage.getItem(ROLLOVER_GATE_KEY); }catch(e){ lastGate = null; }
  if(lastGate === today) return;
  let moved = 0;
  const changed = [];
  state.items.forEach(it=>{
    if((it.status==='todo'||it.status==='doing') && it.activeDate < today){
      const gap = daysBetween(it.activeDate, today);
      it.rolloverCount = (it.rolloverCount||0) + gap;
      addLog(it, `הועבר אוטומטית מתאריך ${heDate(it.activeDate)} ל-${heDate(today)} — לא הושלם`, true);
      it.activeDate = today;
      moved++;
      changed.push(it);
    }
  });
  try{ localStorage.setItem(ROLLOVER_GATE_KEY, today); }catch(e){}
  if(changed.length && window.__hub){
    try{
      const { db, doc, writeBatch } = window.__hub;
      const batch = writeBatch(db);
      changed.forEach(it=> batch.update(doc(db, FS.items, it.id), { activeDate: it.activeDate, rolloverCount: it.rolloverCount, log: it.log }));
      batch.commit().catch(e=>console.error('rollover batch commit failed', e));
    }catch(e){ console.error('rollover batch failed', e); }
  }
  if(moved>0) setTimeout(()=>showToast(`${moved} פריטים לא-גמורים הועברו אוטומטית להיום`), 400);
}

function addLog(item, text, silent){
  item.log = item.log || [];
  item.log.unshift({ ts: nowTs(), actor: silent ? 'מערכת' : state.currentUser, text });
}

/* ============================= AUTH / LOGIN / REAL-TIME SYNC ============================= */
/* Identity = Firebase Email/Password on project vas--system (the same Auth user pool that
   vas-control uses). Authorization = a doc at hub_team/{emailLowercase} with active===true.
   onAuthStateChanged is the ONLY session source of truth (Firebase persists the session);
   Firestore listeners are attached only after an authorized login, and detached on logout. */
const ROLE_LABEL = { manager:'מנהל/ת', office:'משרד', field:'שטח' };
const FINANCIAL_TYPES = ['invoice','quote','supplier_bill'];
const FIELD_ITEM_TYPES = ['task','reminder']; // the only hub_items types a field user may read/write
const HUB_ROLES = ['manager','office','field'];
const MSG_NOT_AUTHORIZED = 'המשתמש לא מורשה למערכת הזו — פנה למנהל';
const MSG_PERMISSION_DENIED = 'אין הרשאה לנתונים — ייתכן שכללי האבטחה עדיין לא עודכנו או שהמשתמש לא מורשה';
let hubAuthUser = null;
let authResolvedOnce = false;
let authGeneration = 0;          // guards against out-of-order async auth callbacks
let pendingLoginMessage = '';    // shown on the login form after a forced sign-out
let dailyAlertPending = false;
let unsubTeam=null, unsubItems=null, unsubSuppliers=null, unsubCustomers=null;
let hubBridgeHooked = false;

try{ localStorage.removeItem('vas_hub_session'); }catch(e){} // legacy PIN session — no longer used

function normEmail(e){ return String(e||'').trim().toLowerCase(); }
function isOwnerEmail(e){ return normEmail(e) === normEmail(HUB_OWNER_EMAIL); }
function isLegacyUser(u){ return !u || u.pin !== undefined || !String(u.id||'').includes('@'); }

window.__hubBridgeReady = function(){
  if(hubBridgeHooked || !window.__hub) return;
  hubBridgeHooked = true;
  const { auth, onAuthStateChanged } = window.__hub;
  onAuthStateChanged(auth, user=>{ onHubAuthChanged(user); });
};
window.__hubAuthError = function(err){
  showLoginError('שגיאת התחברות לשרת — בדוק/י את החיבור לאינטרנט ורענן/י את הדף.');
};
// Fallback: if auth never resolves (blocked network, ad-blocker, etc.) stop staring at "מתחבר…"
setTimeout(()=>{ if(!authResolvedOnce) showLoginError('לא הצלחנו להתחבר לשרת. בדוק/י חיבור לאינטרנט ורענן/י את הדף.'); }, 15000);

function showLoginError(msg){

function setLoginError(msg){

}
function setLoginOk(msg){

/* Friendly Hebrew auth errors. Wrong password and unknown user deliberately share ONE
   generic message so the login form never reveals whether an email is registered. */
function authErrorMessage(err){
  const code = (err && err.code) || '';
  switch(code){
    case 'auth/invalid-credential':
    case 'auth/invalid-login-credentials':
    case 'auth/wrong-password':
    case 'auth/user-not-found':
    case 'auth/invalid-email':
    case 'auth/missing-password':
      return 'האימייל או הסיסמה שגויים';
    case 'auth/too-many-requests':
      return 'יותר מדי ניסיונות כניסה — החשבון נחסם זמנית. נסה/י שוב בעוד כמה דקות או אפס/י סיסמה.';
    case 'auth/network-request-failed':
      return 'אין חיבור לשרת — בדוק/י את החיבור לאינטרנט ונסה/י שוב.';
    case 'auth/user-disabled':
      return 'החשבון הזה הושבת — פנה/י למנהל.';
    default:
      return 'הכניסה נכשלה — נסה/י שוב.';
  }
}

async function submitLogin(ev){
  if(ev && ev.preventDefault) ev.preventDefault();
  if(!window.__hub){ setLoginError('אין חיבור לשרת כרגע'); return; }
  const email = normEmail((document.getElementById('loginEmail')||{}).value);
  const password = (document.getElementById('loginPassword')||{}).value || '';
  if(!email || !password){ setLoginError('יש להזין אימייל וסיסמה'); return; }
  pendingLoginMessage = '';
  setLoginError('');
  const btn = document.getElementById('loginSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'מתחבר…'; }
  try{
    const { auth, signInWithEmailAndPassword } = window.__hub;
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged takes it from here (authorization check + entering the app)
    try{
      if(window.__vasapp && !(window.__vasapp.auth && window.__vasapp.auth.currentUser)){
        window.__vasapp.signInWithEmailAndPassword(window.__vasapp.auth, email, password).catch(()=>{});
      }
    }catch(e){}
  }catch(e){
    setLoginError(authErrorMessage(e));
    const pw = document.getElementById('loginPassword'); if(pw) pw.value='';
    if(btn){ btn.disabled = false; btn.textContent = 'כניסה'; }
  }
}

async function forgotPassword(){
  const email = normEmail((document.getElementById('loginEmail')||{}).value);
  if(!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ setLoginError('יש להזין את כתובת האימייל בשדה למעלה ואז ללחוץ "שכחתי סיסמה"'); return; }
  if(!window.__hub){ setLoginError('אין חיבור לשרת כרגע'); return; }
  try{
    const { auth, sendPasswordResetEmail } = window.__hub;
    await sendPasswordResetEmail(auth, email);
  }catch(e){
    const code = (e && e.code) || '';
    if(code==='auth/network-request-failed' || code==='auth/too-many-requests'){ setLoginError(authErrorMessage(e)); return; }
    // any other error (incl. user-not-found) falls through to the SAME neutral message
  }
  setLoginOk('אם הכתובת רשומה במערכת, נשלח אליה קישור לבחירת סיסמה חדשה. כדאי לבדוק גם בתיקיית הספאם.');
}

async function onHubAuthChanged(user){
  const gen = ++authGeneration;
  authResolvedOnce = true;
  hubAuthUser = user || null;
  if(!user){
    stopFirestoreSync();
    clearSessionState();
    showLoginScreen();
    renderLoginForm(pendingLoginMessage);
    return;
  }
  // A session left over from the old anonymous version (or any non-email provider) is not a hub identity.
  if(user.isAnonymous || !user.email){
    try{ await window.__hub.signOut(window.__hub.auth); }catch(e){}
    if(gen===authGeneration){ showLoginScreen(); renderLoginForm(pendingLoginMessage); }
    return;
  }
  const email = normEmail(user.email);
  showLoginScreen();
  showLoginStatus('בודק הרשאות…');
  try{
    const { db, doc, getDoc, setDoc } = window.__hub;
    const ref = doc(db, FS.team, email);
    const snap = await getDoc(ref);
    if(gen!==authGeneration) return;
    let data = snap.exists() ? snap.data() : null;
    // Owner bootstrap: the owner email (HUB_OWNER_EMAIL) gets a manager doc on first login.
    if(!data && isOwnerEmail(email)){
      data = { name:'אבישי', email, role:'manager', active:true, createdAt: Date.now(), createdBy: email };
      await setDoc(ref, data);
      if(gen!==authGeneration) return;
    }
    if(!data || data.active!==true || isLegacyUser({ id: email, ...data }) || !HUB_ROLES.includes(data.role)){
      await denyAccess(MSG_NOT_AUTHORIZED);
      return;
    }
    enterApp(email, data);
  }catch(e){
    console.error('authorization check failed', e);
    if(gen!==authGeneration) return;
    const code = (e && e.code) || '';
    await denyAccess(code==='unavailable' || code==='auth/network-request-failed'
      ? 'אין חיבור לשרת — בדוק/י את החיבור לאינטרנט ונסה/י שוב.'
      : MSG_NOT_AUTHORIZED);
  }
}

async function denyAccess(message){
  pendingLoginMessage = message || '';
  stopFirestoreSync();
  clearSessionState();
  try{ if(window.__hub) await window.__hub.signOut(window.__hub.auth); }catch(e){ console.error('signOut failed', e); }
  showLoginScreen();
  renderLoginForm(pendingLoginMessage);
}

function clearSessionState(){
  state.currentUser=''; state.currentUserId=''; state.currentUserRole='';
  state.items = []; state.users = []; state.team = [];
  state.supplierDirectory = {}; state.customerDirectory = {};
  customerImportPreviewRows = [];
  try{ closeModal(); }catch(e){}
}

function setWhoami(){

  document.getElementById('whoamiRole').textContent = ROLE_LABEL[state.currentUserRole]||state.currentUserRole;
  document.getElementById('whoamiRole').className = 'role-badge '+state.currentUserRole;

function enterApp(email, data){
  state.currentUser = data.name || email;
  state.currentUserId = email;

  startFirestoreSync();

function permissionToast(label, err){
  console.error(label+' snapshot error', err);
  if(err && err.code==='permission-denied') showToast(MSG_PERMISSION_DENIED);
  else showToast('שגיאה בטעינת נתונים מהשרת');
}

function stopFirestoreSync(){
  [unsubTeam, unsubItems, unsubSuppliers, unsubCustomers].forEach(fn=>{ try{ if(fn) fn(); }catch(e){} });
  unsubTeam=null; unsubItems=null; unsubSuppliers=null; unsubCustomers=null;
}
function stopRoleDataListeners(){
  [unsubItems, unsubSuppliers, unsubCustomers].forEach(fn=>{ try{ if(fn) fn(); }catch(e){} });
  unsubItems=null; unsubSuppliers=null; unsubCustomers=null;
}

function startFirestoreSync(){
  if(!window.__hub || !state.currentUserId) return; // never before an authorized login
  const { db, collection, onSnapshot } = window.__hub;
  if(!unsubTeam){
    unsubTeam = onSnapshot(collection(db, FS.team), snap=>{
      const docs = [];
      snap.forEach(d=> docs.push({ id:d.id, ...d.data() }));
      state.users = docs;
      state.team = docs.filter(u=>!isLegacyUser(u) && u.active).map(u=>u.name);
      if(!state.currentUserId) return;
      // Live-reflect role/active changes on the logged-in user without requiring re-login.
      const me = docs.find(u=>u.id===state.currentUserId);
      if(!me || me.active!==true){
        logout(true, 'ההרשאה שלך הוסרה או שהמשתמש בוטל — יש להתחבר מחדש.');
        return;
      }
      if(me.role !== state.currentUserRole || me.name !== state.currentUser){
        const roleChanged = me.role !== state.currentUserRole;
        state.currentUserRole = me.role;
        state.currentUser = me.name;
        setWhoami();
        applyRoleVisibility();
        guardCurrentView();
        if(roleChanged){ state.items=[]; state.supplierDirectory={}; state.customerDirectory={}; stopRoleDataListeners(); startRoleDataListeners(); }
      }
      if(document.getElementById('app').style.display!=='none') render();
    }, err=>{
      console.error('hub_team snapshot error', err);
      if(err && err.code==='permission-denied' && state.currentUserId){
        // under the hub_ rules this means our own hub_team doc was deactivated/removed
        logout(true, MSG_NOT_AUTHORIZED);
      } else permissionToast('hub_team', err);
    });
  }
  startRoleDataListeners();
}

/* Firestore rules are not filters — each query below matches exactly what the hub_ rules
   allow for the role, so nothing is rejected for a legitimate user. */
function startRoleDataListeners(){
  if(!window.__hub || !state.currentUserId) return;
  const { db, collection, onSnapshot, query, where } = window.__hub;
  const role = state.currentUserRole;
  const office = (role==='manager' || role==='office');

  if(!unsubItems){
    const itemsRef = office
      ? collection(db, FS.items)
      : query(collection(db, FS.items), where('type','in', FIELD_ITEM_TYPES));
    unsubItems = onSnapshot(itemsRef, snap=>{
      const docs = [];
      snap.forEach(d=> docs.push({ id:d.id, ...d.data() }));
      state.items = docs;
      if(document.getElementById('app').style.display!=='none'){
        runRollover();
        render();
        if(dailyAlertPending){ dailyAlertPending=false; setTimeout(maybeShowDailyAlert, 400); }
      }
    }, err=>permissionToast('hub_items', err));
  }

  if(!office) return; // field: no suppliers / customers / financial listeners at all

  if(!unsubSuppliers){
    unsubSuppliers = onSnapshot(collection(db, FS.suppliers), snap=>{
      const dir = {};
      snap.forEach(d=>{ const data=d.data(); dir[data.name||d.id] = { terms:data.terms||'', method:data.method||'' }; });
      state.supplierDirectory = dir;
    }, err=>permissionToast('hub_suppliers', err));
  }

  if(!unsubCustomers){
    unsubCustomers = onSnapshot(collection(db, FS.customers), snap=>{
      const dir = {};
      snap.forEach(d=>{
        const data = d.data();
        const name = data.name || d.id;
        dir[name] = { name, phone:data.phone||'', email:data.email||'', contact:data.contact||'', city:data.city||'', vatId:data.vatId||'', notes:data.notes||'' };
      });
      state.customerDirectory = dir;
      if(currentView==='customers' && document.getElementById('app').style.display!=='none') render();
    }, err=>permissionToast('hub_customers', err));
  }
}

function logout(silent, message){
  pendingLoginMessage = message || '';
  authGeneration++; // cancel any in-flight authorization check
  stopFirestoreSync(); // detach BEFORE signing out so listeners don't error on the way out
  clearSessionState();
  showLoginScreen();
  renderLoginForm(pendingLoginMessage);
  if(!silent) showToast('התנתקת');
  stopVasAppSync(); vasAppReadyUser = null; vasAppUnavailable = false;
  try{ if(window.__vasapp && window.__vasapp.auth) window.__vasapp.signOut(window.__vasapp.auth).catch(()=>{}); }catch(e){}
  if(window.__hub){
    try{
      const p = window.__hub.signOut(window.__hub.auth);
      if(p && p.catch) p.catch(e=>console.error('signOut failed', e));
    }catch(e){ console.error('signOut failed', e); }
  }
}

/* ============================= PASSWORD POLICY (client side) ============================= */
/* Mirrors the server-side policy the owner sets in Firebase Console → Authentication →
   Settings → Password policy. One validator, used everywhere a password is chosen in-app. */
const PASSWORD_MIN_LEN = 12;
const PASSWORD_BLOCKLIST = ['12345678','1234','password','qwerty','vas','vassecurity','vas-security','svsecurity','s-vsecurity','vassecurityltd','admin'];
function passwordChecks(pw, email){
  pw = String(pw||'');
  const lower = pw.toLowerCase();
  const alnum = lower.replace(/[^a-z0-9]/g,'');
  const local = normEmail(email).split('@')[0] || '';
  const containsLocal = local.length>=3 && (lower.includes(local) || (local.replace(/[^a-z0-9]/g,'').length>=3 && alnum.includes(local.replace(/[^a-z0-9]/g,''))));
  const common = PASSWORD_BLOCKLIST.some(w=>{ const wn = w.replace(/[^a-z0-9]/g,''); return lower.includes(w) || (wn && alnum.includes(wn)); });
  return [
    { key:'len',    label:`לפחות ${PASSWORD_MIN_LEN} תווים`, ok: pw.length >= PASSWORD_MIN_LEN },
    { key:'upper',  label:'אות גדולה באנגלית', ok: /[A-Z]/.test(pw) },
    { key:'lower',  label:'אות קטנה באנגלית', ok: /[a-z]/.test(pw) },
    { key:'digit',  label:'ספרה', ok: /[0-9]/.test(pw) },
    { key:'symbol', label:'סימן מיוחד', ok: /[^A-Za-z0-9]/.test(pw) },
    { key:'email',  label:'לא מכילה את שם המשתמש מהאימייל', ok: pw.length>0 && !containsLocal },
    { key:'common', label:'לא סיסמה נפוצה / שם החברה', ok: pw.length>0 && !common },
  ];
}
function validatePassword(pw, email){ return passwordChecks(pw, email).every(c=>c.ok); }
function passwordChecklistHtml(pw, email){
  return `<ul class="pw-checklist">${passwordChecks(pw, email).map(c=>`<li class="${c.ok?'ok':'bad'}">${c.ok?'✓':'✗'} ${escapeHtml(c.label)}</li>`).join('')}</ul>`;
}

async function submitChangePassword(ev){
  if(ev && ev.preventDefault) ev.preventDefault();
  const errEl = document.getElementById('cp_err');
  const setErr = (m)=>{ if(errEl) errEl.textContent = m; };
  const current = (document.getElementById('cp_current')||{}).value || '';
  const next = (document.getElementById('cp_new')||{}).value || '';
  const confirmPw = (document.getElementById('cp_confirm')||{}).value || '';
  if(!current){ setErr('יש להזין את הסיסמה הנוכחית'); return; }
  if(!validatePassword(next, state.currentUserId)){ setErr('הסיסמה החדשה לא עומדת בכל הדרישות'); return; }
  if(next !== confirmPw){ setErr('האימות לא תואם לסיסמה החדשה'); return; }
  if(next === current){ setErr('הסיסמה החדשה חייבת להיות שונה מהנוכחית'); return; }
  if(!window.__hub){ setErr('אין חיבור לשרת כרגע'); return; }
  const { auth, EmailAuthProvider, reauthenticateWithCredential, updatePassword } = window.__hub;
  const user = auth && auth.currentUser;
  if(!user){ setErr('יש להתחבר מחדש'); return; }
  const btn = document.getElementById('cp_submit'); if(btn) btn.disabled = true;
  try{
    const cred = EmailAuthProvider.credential(user.email, current);
    await reauthenticateWithCredential(user, cred);
  }catch(e){
    if(btn) btn.disabled = false;
    const code = (e && e.code) || '';
    if(code==='auth/too-many-requests' || code==='auth/network-request-failed') setErr(authErrorMessage(e));
    else setErr('הסיסמה הנוכחית שגויה');
    return;
  }
  try{
    await updatePassword(user, next);
    closeModal();
    showToast('הסיסמה עודכנה בהצלחה');
  }catch(e){
    if(btn) btn.disabled = false;
    const code = (e && e.code) || '';
    if(code==='auth/weak-password' || code==='auth/password-does-not-meet-requirements') setErr('השרת דחה את הסיסמה — היא לא עומדת במדיניות הסיסמאות');
    else if(code==='auth/requires-recent-login') setErr('יש להתנתק ולהתחבר מחדש, ואז לנסות שוב');
    else setErr('עדכון הסיסמה נכשל — נסה/י שוב');
  }
}

/* ============================= VAS-APP INTEGRATION ============================= */
/* Manual, per-task, opt-in push of a hub task into the already-live field-team app
   ("vas-app" / avishayvas.github.io/Vas-app), plus bidirectional status sync, built
   entirely from the hub side against vas-app's own Firestore doc vas/punch. See the
   module script above for the separate `vasapp` Firebase app instance and window.__vasapp
   bridge. Nothing here may ever throw uncaught — a failure just disables this feature. */
const VASAPP_CAN_PUSH_ROLES = ['manager','office'];
let vasAppUnavailable = false;   // set true on init/auth/listener failure -> feature disabled
let vasAppReadyUser = null;
let vasAppUnsub = null;
let vasAppCache = { projects: [], team: [], tasksById: {} }; // kept fresh by the live listener
let currentDetailItemId = null; // which hub item's detail modal is currently open, for live badge refresh

function vasAppCanUse(){
  return !!window.__vasapp && !vasAppUnavailable && VASAPP_CAN_PUSH_ROLES.includes(state.currentUserRole);
}

let vasAppFirstSnap = false;
let vaPendingPushId = null;
window.__vasAppReady = function(user){
  vasAppReadyUser = user;
  startVasAppSync();
};
window.__vasAppSignedOut = function(){
  vasAppReadyUser = null;
  stopVasAppSync();
};
function stopVasAppSync(){
  if(vasAppUnsub){ try{ vasAppUnsub(); }catch(e){} vasAppUnsub = null; }
  vasAppFirstSnap = false;
}
window.__vasAppError = function(err){
  vasAppUnavailable = true;
  console.error('vas-app connection unavailable', err);
  if(typeof showToast === 'function') showToast('⚠️ החיבור לאפליקציית השטח לא זמין — השליחה לאפליקציה מושבתת זמנית');
};

function startVasAppSync(){
  if(!window.__vasapp || vasAppUnsub || !vasAppReadyUser) return;
  if(!VASAPP_CAN_PUSH_ROLES.includes(state.currentUserRole)) return; // field / not logged in: no cross-app listener
  try{
    const { db, doc, onSnapshot } = window.__vasapp;
    vasAppUnsub = onSnapshot(doc(db, 'vas', 'punch'), snap=>{
      const data = snap.exists() ? snap.data() : null;
      vasAppCache.projects = (data && data.projects) || [];
      vasAppCache.team = (data && data.team) || [];
      const byId = {};
      ((data && data.tasks) || []).forEach(t=>{ byId[t.id] = t; });
      vasAppCache.tasksById = byId;
      vasAppFirstSnap = true;
      applyVasAppSnapshotToHub();
      // keep an open detail modal's live badge in sync without the office re-opening it
      if(currentDetailItemId){
        const it = state.items.find(i=>i.id===currentDetailItemId);
        if(it && it.vasAppTaskId) showModal(detailHtml(it));
      }
    }, err=>{
      vasAppUnavailable = true;
      console.error('vas-app snapshot error', err);
      showToast('⚠️ אין גישה לנתוני אפליקציית השטח — הפיצ׳ר מושבת');
    });
  }catch(err){
    vasAppUnavailable = true;
    console.error('vas-app sync setup failed', err);
  }
}

const vasAppUid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
function vasAppNowTime(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function hubStatusToVasAppStatus(hubStatus){
  // 'cancelled' is intentionally absent — vas-app has no matching concept, callers must
  // check for it separately and skip the sync rather than mapping it to something wrong.
  return { todo:'פתוח', doing:'בטיפול', done:'אושר' }[hubStatus] || 'פתוח';
}

/* ---------- vas-app -> hub: reflect a technician's completion back onto the hub item ---------- */
function applyVasAppSnapshotToHub(){
  if(!window.__hub) return;
  state.items.forEach(it=>{
    if(!it.vasAppTaskId) return;
    const t = vasAppCache.tasksById[it.vasAppTaskId];
    if(!t) return;
    if(it.status==='done') return; // already done on the hub side — nothing to do, and this
                                    // early-return is what keeps the sync a harmless no-op on
                                    // every later snapshot instead of re-logging forever.
    if(t.status==='בוצע' || t.status==='אושר'){
      const actor = t.closedBy || t.updatedBy || 'מערכת (אפליקציית השטח)';
      it.status = 'done';
      it.doneDate = todayStr();
      it.completedBy = actor;
      addLog(it, `סומן כהושלם באפליקציית השטח ע״י ${actor}`);
      const { db, doc, updateDoc } = window.__hub;
      updateDoc(doc(db, FS.items, it.id), { status: it.status, doneDate: it.doneDate, completedBy: it.completedBy, log: it.log })
        .catch(e=>console.error('vas-app->hub status sync write failed', e));
      render();
    }
  });
}

/* ---------- hub -> vas-app: push a status change the office made on an already-linked item ---------- */
function syncStatusToVasApp(it, hubStatus){
  if(!it.vasAppTaskId || !vasAppCanUse()) return;
  if(hubStatus==='cancelled') return; // vas-app has no "cancelled" state — deliberately not synced
  const targetStatus = hubStatusToVasAppStatus(hubStatus);
  const { db, doc, runTransaction } = window.__vasapp;
  const docRef = doc(db, 'vas', 'punch');
  runTransaction(db, async (tx)=>{
    const snap = await tx.get(docRef);
    if(!snap.exists()) throw new Error('vas/punch doc missing');
    const data = snap.data();
    const tasks = (data.tasks || []).slice();
    const idx = tasks.findIndex(t=>t.id===it.vasAppTaskId);
    if(idx===-1) return; // task was removed on the vas-app side — nothing to patch
    const t = { ...tasks[idx] };
    if(t.status===targetStatus) return; // already there — compare-before-write, avoids loop churn
    t.status = targetStatus;
    t.updatedBy = state.currentUser;
    t.updatedAt = todayStr();
    if(targetStatus==='אושר'){ t.closedBy = state.currentUser; t.closedAt = todayStr(); t.closedTime = vasAppNowTime(); }
    tasks[idx] = t;
    tx.update(docRef, { tasks });
  }).catch(e=>{ console.error('hub->vas-app status sync failed', e); showToast('עדכון הסטטוס באפליקציית השטח נכשל (החיבור המקומי בהאב נשמר בסדר)'); });
}

/* ---------- manual per-task push dialog ---------- */
let vaMode = 'existing';
function openVasAppPushDialog(id){
  const it = state.items.find(i=>i.id===id);
  if(!it) return;
  if(!VASAPP_CAN_PUSH_ROLES.includes(state.currentUserRole)) return;
  if(it.type!=='task'){ showToast('ניתן לשלוח לאפליקציית השטח רק משימות'); return; }
  if(it.vasAppTaskId){ showToast('הפריט כבר נשלח לאפליקציית השטח'); return; }
  if(!window.__vasapp){ showToast('החיבור לאפליקציית השטח אינו זמין כרגע'); return; }
  if(!vasAppReadyUser){ openVasAppLoginDialog(id); return; }
  if(vasAppUnavailable){ openVasAppLoginDialog(id, 'למשתמש שמחובר כרגע לאפליקציית השטח אין גישה לנתונים שם. התחבר/י עם משתמש אחר.'); return; }
  if(!vasAppCanUse()){ showToast('החיבור לאפליקציית השטח אינו זמין כרגע'); return; }
  vaMode = 'existing';
  showModal(vasAppPushDialogHtml(it));
}
/* ---------- one-time sign-in to vas-app (its own accounts, remembered by the browser) ---------- */
function openVasAppLoginDialog(id, note){
  vaPendingPushId = id || null;
  const pre = (vasAppReadyUser && vasAppReadyUser.email) || state.currentUserId || '';
  showModal(`
    <div class="modal-head"><h2>התחברות לאפליקציית השטח</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p class="hint" style="margin-top:0">כדי לשלוח משימות לאפליקציית השטח צריך להתחבר פעם אחת עם המשתמש שלך באפליקציית השטח — אותו אימייל וסיסמה שאיתם נכנסים אליה. הדפדפן יזכור את החיבור.</p>
    ${note?`<div class="login-error" style="text-align:right;margin-bottom:10px">${escapeHtml(note)}</div>`:''}
    <form onsubmit="submitVasAppLogin(event)">
      <label class="field"><b>אימייל</b><input type="email" id="vaLoginEmail" autocomplete="username" dir="ltr" value="${escapeAttr(pre)}"></label>
      <label class="field"><b>סיסמה</b><input type="password" id="vaLoginPassword" autocomplete="current-password" dir="ltr"></label>
      <div class="login-error" id="vaLoginError"></div>
      <div class="modal-foot">
        <button type="submit" class="btn btn-primary" id="vaLoginBtn">התחברות</button>
        <button type="button" class="btn" onclick="closeModal()">ביטול</button>
      </div>
    </form>
  `);
  setTimeout(()=>{ const f=document.getElementById(pre?'vaLoginPassword':'vaLoginEmail'); if(f) f.focus(); }, 50);
}
function waitForVasAppFirstSnap(ms){
  return new Promise(resolve=>{
    const t0 = Date.now();
    (function tick(){
      if(vasAppFirstSnap || vasAppUnavailable || Date.now()-t0 > ms) return resolve();
      setTimeout(tick, 100);
    })();
  });
}
async function submitVasAppLogin(ev){
  if(ev && ev.preventDefault) ev.preventDefault();
  const email = String((document.getElementById('vaLoginEmail')||{}).value||'').trim().toLowerCase();
  const pw = (document.getElementById('vaLoginPassword')||{}).value || '';
  const errEl = document.getElementById('vaLoginError');
  const btn = document.getElementById('vaLoginBtn');
  if(!email || !pw){ if(errEl) errEl.textContent = 'יש להזין אימייל וסיסמה'; return; }
  if(btn){ btn.disabled = true; btn.textContent = 'מתחבר…'; }
  try{
    const { auth, signInWithEmailAndPassword } = window.__vasapp;
    stopVasAppSync();
    vasAppUnavailable = false;
    const cred = await signInWithEmailAndPassword(auth, email, pw);
    vasAppReadyUser = cred.user;
    startVasAppSync();
    await waitForVasAppFirstSnap(6000);
    const id = vaPendingPushId; vaPendingPushId = null;
    if(vasAppUnavailable){
      if(errEl) errEl.textContent = 'ההתחברות הצליחה, אבל למשתמש הזה אין גישה לנתוני אפליקציית השטח.';
      if(btn){ btn.disabled = false; btn.textContent = 'התחברות'; }
      return;
    }
    showToast('מחובר/ת לאפליקציית השטח');
    if(id) openVasAppPushDialog(id); else closeModal();
  }catch(e){
    if(errEl) errEl.textContent = authErrorMessage(e);
    const f = document.getElementById('vaLoginPassword'); if(f) f.value = '';
    if(btn){ btn.disabled = false; btn.textContent = 'התחברות'; }
  }
}

function vasAppPushDialogHtml(it){
  const projects = (vasAppCache.projects||[]).filter(p=>p.active);

    <p class="hint" style="margin-top:0">המשימה "<b style="color:var(--text)">${escapeHtml(it.title)}</b>" תישלח כמשימה חדשה באפליקציית השטח (vas-app), כדי שהטכנאים יראו אותה במקום שהם כבר עובדים בו.</p>

function vasAppModeBodyHtml(projects){

      <div class="hint" style="margin-top:-6px">ייווצר כפרויקט רגיל וקבוע באפליקציית השטח — ניתן יהיה לערוך את שמו משם בעתיד, בדיוק כמו כל פרויקט אחר.</div>`;
  }

function vaSwitchMode(mode){
  vaMode = mode;
  const existingBtn = document.getElementById('vaModeExisting');
  const newBtn = document.getElementById('vaModeNew');
  if(existingBtn) existingBtn.classList.toggle('active', mode==='existing');
  if(newBtn) newBtn.classList.toggle('active', mode==='new');
  const body = document.getElementById('vaModeBody');
  if(body) body.innerHTML = vasAppModeBodyHtml((vasAppCache.projects||[]).filter(p=>p.active));
}
async function confirmPushToVasApp(id){
  const it = state.items.find(i=>i.id===id);
  if(!it) return;
  if(it.vasAppTaskId){ showToast('הפריט כבר נשלח לאפליקציית השטח'); closeModal(); return; } // double-push guard
  if(!vasAppCanUse()){ showToast('החיבור לאפליקציית השטח אינו זמין כרגע'); return; }

  let mode = vaMode, projectId = '', newProjectName = '';
  if(mode==='new'){
    const el = document.getElementById('va_newproj');
    newProjectName = el ? el.value.trim() : '';
    if(!newProjectName){ showToast('יש להזין שם לפרויקט/לקוח החדש'); return; }
  } else {
    const el = document.getElementById('va_project');
    projectId = el ? el.value : '';
    if(!projectId){ showToast('יש לבחור פרויקט קיים'); return; }
  }

  closeModal();
  showToast('שולח לאפליקציית השטח…');
  try{
    const result = await pushTaskToVasAppTx(it, mode, projectId, newProjectName);
    it.vasAppTaskId = result.taskId;
    it.vasAppProjectId = result.projectId;
    it.vasAppProjectName = result.projectName;
    it.vasAppPushedAt = todayStr();
    it.vasAppPushedBy = state.currentUser;
    addLog(it, `נשלח לאפליקציית השטח · פרויקט: ${result.projectName}`);
    if(window.__hub){
      const { db, doc, updateDoc } = window.__hub;
      await updateDoc(doc(db, FS.items, it.id), {
        vasAppTaskId: it.vasAppTaskId, vasAppProjectId: it.vasAppProjectId,
        vasAppProjectName: it.vasAppProjectName, vasAppPushedAt: it.vasAppPushedAt,
        vasAppPushedBy: it.vasAppPushedBy, log: it.log
      });
    }
    showToast('✅ נשלח לאפליקציית השטח');
    render();
    if(currentDetailItemId===it.id) showModal(detailHtml(it));
  }catch(e){
    console.error('push to vas-app failed', e);
    showToast('השליחה לאפליקציית השטח נכשלה — נסה/י שוב');
  }
}
/* Every field of the vas-app task object below is required — their own rendering code
   (e.g. t.nudge.by) has no null-guard for a missing field, only for values that ARE
   present but empty/null, so we always supply every key with a safe empty default. */
async function pushTaskToVasAppTx(it, mode, projectId, newProjectName){
  const { db, doc, runTransaction } = window.__vasapp;
  const docRef = doc(db, 'vas', 'punch');
  return runTransaction(db, async (tx)=>{
    const snap = await tx.get(docRef);
    if(!snap.exists()) throw new Error('vas/punch doc missing');
    const data = snap.data();
    const projects = (data.projects || []).slice();
    const tasks = (data.tasks || []).slice();

    let finalProjectId = projectId, finalProjectName = '';
    if(mode==='new'){
      finalProjectId = vasAppUid();
      finalProjectName = newProjectName;
      projects.push({ id: finalProjectId, name: finalProjectName, client: '', type: '', desc: '', active: true });
    } else {
      const p = projects.find(p=>p.id===projectId);
      if(!p) throw new Error('הפרויקט שנבחר לא נמצא יותר');
      finalProjectName = p.name;
    }

    const taskId = vasAppUid();
    const newTask = {
      id: taskId,
      projectId: finalProjectId,
      title: it.title || '',
      location: '',
      discipline: 'כללי',
      assignee: it.assignee || '',
      urgency: it.priority==='urgent' ? 'דחוף' : 'רגיל',
      status: hubStatusToVasAppStatus(it.status),
      due: it.dueDate || '',
      notes: it.desc || '',
      created: todayStr(),
      createdTime: vasAppNowTime(),
      createdBy: state.currentUser || '',
      updatedBy: state.currentUser || '',
      updatedAt: todayStr(),
      report: '',
      doneDesc: '',
      doneBy: '',
      doneAt: '',
      doneQty: '',
      qty: '',
      contDate: '',
      closedBy: '',
      closedAt: '',
      closedTime: '',
      claimReq: false,
      nudge: { by:'', at:'' },
      billing: null,
      media: [],
      upsell: '',
      upsellType: ''
    };
    tasks.push(newTask);
    tx.update(docRef, { projects, tasks });
    return { taskId, projectId: finalProjectId, projectName: finalProjectName };
  });
}

function vasAppBadgeHtml(it){
  const t = vasAppCache.tasksById[it.vasAppTaskId];
  const liveStatus = t ? t.status : '—';
  return `<div class="vasapp-badge">

function vasAppPushSectionHtml(it){
  if(state.currentUserRole==='field' || it.type!=='task') return '';

  if(!VASAPP_CAN_PUSH_ROLES.includes(state.currentUserRole)) return '';

}
